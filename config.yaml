# ─────────────────────────────────────────────
#  Empirical Study Pipeline – Configuration
# ─────────────────────────────────────────────

workdir: "."

# ── Generation ────────────────────────────────
agent:
  type: "chatdev"
  model: "gemma4:31b"
  api_key: "ollama"
  api_base: "http://localhost:11434/v1"
  temperature: 0.2
  workflow: "agents/chatdev.yaml"             # ChatDev's coding workflow
  prompt_template: "prompts/v1.0.md"          # path to the generation prompt
  generated_dir: "generated"
  timeout: 1800                               # generation HTTP timeout in seconds (default: 30 minutes)
  stream: true                                # stream tokens live to console

# ── Validation ────────────────────────────────
validation:
  # Code path to validate when running `--phase val` standalone
  # (ignored when running `--phase all`, where the code path comes from
  # the generation phase's GenerationResult instead).
  generated: "generated"

  # Stage 1 – Compilability
  docker:
    image: "python:3.11-slim"
    timeout_seconds: 60
    workdir: "/app"

  # Stage 2 – Functional tests (HTTP)
  http:
    base_url: "http://localhost:8000"
    timeout_seconds: 10

# ── Validator settings ─────────────────────────
# Read directly by the validator classes (validators/*.py).
validator:
  start_command_file: "start_command.txt"
  boot_wait_seconds: 15          # Stage 1 – how long to wait for the server to crash on boot
  smoke_path: "/"                # Stage 1 – path probed after boot to catch startup-time 5xx
  smoke_timeout: 10
  nfr_trace_filename: "nfr-trace.json"   # Stage 3 – NFR trace file name inside the code dir

  expect_workflow_manifest: true

# ── Output ────────────────────────────────────
output:
  report_dir: "generated/reports/"

# ── Stage 1 analysis modules ──────────────────────────────────────────────
stage1:
  ontology_path: materials/M2-orderman-ontology.yaml
  modals: [shall, must, should, will, can, may]
  articles: [a, an, the]
  singularize_nouns: false
  spacy_model: en_core_web_sm
  split_identifiers: true
  keep_negation_cue_tokens: false
  non_negating_phrases:
    - no more than
    - not more than
    - no less than
    - not less than
    - no later than
    - no earlier than
    - no fewer than
    - no greater than
    - no longer than
    - at least
    - at most

  # Metric 7 - Diagram Validity (parse_check).
  parse_check:
    plantuml_jar: tools/plantuml.jar
    plantuml_cmd: plantuml
    java_cmd: java
    layout_smetana: false
    timeout_seconds: 60
    extra_args: []

  # Metric 8 - Consistency (consistency), rules CM-01..CM-05.
  consistency:
    rules: [CM-01, CM-02, CM-03, CM-04, CM-05]
    emit_ontology_gaps: true

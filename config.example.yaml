# ─────────────────────────────────────────────
#  Empirical Study Pipeline – Configuration
# ─────────────────────────────────────────────

workdir: "."

# ── Generation ────────────────────────────────
agent:
  type: "direct_api"

  # ollama
  model: "gpt-oss:120b"
  api_key: ""
  api_base: "https://ollama.com/v1"

  temperature: 0.2
  prompt_template: "materials/M1-prompt-GUIDE.md"       # path to the generation prompt
  prompt_inputs: "materials/M1a-transformation.json"   # path to the prompt inputs JSON file
  generated_dir: "generated"
  # max_tokens: 16384                             # DO NOT ENABLE
  timeout: 1800                                    # generation HTTP timeout in seconds (default: 30 minutes)
  stream: true                                     # stream tokens live to console

# ── Evaluation ────────────────────────────────
evaluation:
  # Code path to evaluate when running `--phase val` standalone
  # (ignored when running `--phase all`, where the code path comes from
  # the generation phase's GenerationResult instead).
  generated: "generated"

# ── Evaluator settings ─────────────────────────
# Read directly by the evaluator classes (evaluators/*.py).
evaluator:
  expect_workflow_manifest: true

# ── Output ────────────────────────────────────
output:
  report_dir: "generated/reports/"

# ── Pipeline analysis modules ──────────────────────────────────────────────
pipeline:
  modals: [shall, must, should, will, can, may]
  articles: [a, an, the]
  singularize_nouns: false
  spacy_model: en_core_web_sm
  split_identifiers: true
  keep_negation_cue_tokens: false
  non_negating_phrases:
    - no more than
    - not more than
    - no less than
    - not less than
    - no later than
    - no earlier than
    - no fewer than
    - no greater than
    - no longer than
    - at least
    - at most

  # Metric 7 - Diagram Validity (parse_check).
  parse_check:
    plantuml_jar: tools/plantuml.jar
    plantuml_cmd: plantuml
    java_cmd: java
    layout_smetana: true # replacement for graphviz
    timeout_seconds: 60
    extra_args: []

# ── Requirements Grading (M2) ───────────────────
requirement_grading:
  # --- embedding ---
  embedding_model: "sentence-transformers/all-mpnet-base-v2"
  embedding_revision: null          # pin before the real run; copied into manifest
  pooling: "mean"
  normalize_embeddings: true

  # --- thresholds ---
  threshold: 0.75                   # primary, reported in the paper body
  sweep: [0.70, 0.75, 0.80, 0.85]   # sensitivity analysis; min() is review_threshold
  dedup_threshold: 0.90             # intra-generation clustering

  # --- matching policy ---
  allow_cross_kind: false           # may a gold `ac` be covered by a generated `nfr`
  manual_default: "not_covered"     # substitution used in provisional mode

  # --- rubric and agreement ---
  judge_model: null                 # pinned snapshot, e.g. gpt-4o-2024-08-06
  judge_temperature: 0
  kappa_sample_size: 30
  kappa_accept: 0.60
  random_seed: 20261024

  # --- paths & gold count ---
  gold_path: "materials/G1-requirements.json"
  expected_gold_units: null         # null allows dynamic count (e.g. 59 or 70)

# ── M2 grading: shared keys ───────────────────────────────────────────────
# Read by the grading pipelines only (GradingModels/, GradingRequirements/).
# No grading-relevant number may appear in source code (models spec §9.1).

# --- embedding ---
embedding_model: sentence-transformers/all-mpnet-base-v2
embedding_revision: null          # pin before the real run; copied into manifest
pooling: mean
normalize_embeddings: true

# --- matching policy ---
manual_default: not_covered       # substitution used in provisional mode

# --- rubric and agreement ---
judge_model: null                 # pinned snapshot, e.g. gpt-4o-2024-08-06
judge_temperature: 0
kappa_sample_size: 30
kappa_accept: 0.60
random_seed: 20261024
judge_max_attempts: 3             # calls per element while the reply does not parse

# ── Gold standards (shared by every grading module) ───────────────────────
# One place for every gold / domain-input path; modules read it from here.
# Relative paths are taken from this file's directory.
gold:
  structural: materials/G2-structural-model.puml
  behavioral: materials/G3-behavioral-model.puml
  domain: materials/domain-requirements.md   # rubric traceability input

# ── M2 grading: models section (models spec §9.2) ─────────────────────────
# --- thresholds, models section ---
threshold_models: 0.75            # primary, reported in the paper body
sweep_models: [0.70, 0.75, 0.80, 0.85]
# Short labels (class and action names are 1-3 words) occupy a different
# cosine range from full-sentence acceptance criteria. Starting value is
# shared with Requirements; §16.3 requires its own sensitivity run before
# the number is published.

# --- gate ---
syntax_gate: strict               # strict = require 1.0; no other value yet defined

# --- rubric pooling ---
kappa_pool: per_section           # per_section | pooled
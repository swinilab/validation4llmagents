# ─────────────────────────────────────────────────────────────────────────────
#  Empirical Study Pipeline – Configuration
#
#  1. Run                 where a run is read from and its report written
#  2. Generation          the agent that writes the SRS package
#  3. Grading, shared     embedding, LLM judge and human review: used by every
#                         grading module (reqs, models, vmx)
#  4. Grading, per module thresholds and policy owned by one module
#  5. Gold standards      one place for every gold / domain-input path
#  6. Pipeline analysis   settings of the pipeline/ package (not used by grading)
#
#  Copy this file to config.yaml (git-ignored) and fill in the keys.
#  No grading-relevant number may appear in source code (models spec §9.1).
# ─────────────────────────────────────────────────────────────────────────────

# ── 1. Run ───────────────────────────────────────────────────────────────────
workdir: "."

evaluation:
  # Run to grade with `--phase grade` (ignored with `--phase all`, where the run
  # comes from the generation phase). A run dir (generated/RUN_x) or its
  # sdk_*/code_workspace; results land in the run dir.
  generated: "generated"

output:
  report_dir: "generated/reports/"   # report location when there is no run dir

# ── 2. Generation ────────────────────────────────────────────────────────────
agent:
  type: "direct_api"

  # Endpoint of the generator (OpenAI-compatible). Ollama Cloud here.
  model: "gpt-oss:120b"
  api_base: "https://ollama.com/v1"
  api_key: ""

  temperature: 0.2
  prompt_template: "materials/M1-prompt.md"      # generation prompt
  prompt_inputs: "materials/M1a.json"   # inputs injected into the prompt
  generated_dir: "generated"
  # max_tokens: 16384                                   # DO NOT ENABLE
  timeout: 1800                                         # HTTP timeout in seconds (30 minutes)
  stream: true                                          # stream tokens live to console

# ── 3. Grading, shared by reqs / models / vmx ────────────────────────────────
# --- embedding ---
embedding_model: sentence-transformers/all-mpnet-base-v2
embedding_revision: null          # pin before the real run; copied into the manifest
pooling: mean
normalize_embeddings: true

# --- LLM rubric judge ---
# Must come from a different model family than `agent.model` (spec §7.6).
# With `judge_model: null` there is no judge and unmatched items stay pending.
judge_model: null                 # pinned snapshot, e.g. gpt-4o-2024-08-06
judge_api_base: "https://openrouter.ai/api/v1"
judge_api_key: ""                 # empty: read OPENROUTER_API_KEY (or OPENAI_API_KEY off OpenRouter)
judge_temperature: 0
judge_max_attempts: 3             # calls per element while the reply does not parse

# --- human review and agreement ---
manual_default: not_covered       # substitution used in provisional mode
kappa_sample_size: 30
kappa_accept: 0.60
random_seed: 20261024

# ── 4. Grading, per module ───────────────────────────────────────────────────
# --- reqs (RequirementsGrading) ---
requirement_grading:
  threshold: 0.75                   # primary, reported in the paper body
  sweep: [0.70, 0.75, 0.80, 0.85]   # sensitivity analysis; min() is the review threshold
  dedup_threshold: 0.90             # intra-generation clustering
  allow_cross_kind: false           # may a gold `ac` be covered by a generated `nfr`
  expected_gold_units: null         # null allows a dynamic count (e.g. 59 or 70)

# --- models (ModelsGrading, models spec §9.2) ---
# Short labels (class and action names are 1-3 words) occupy a different cosine
# range from full-sentence acceptance criteria. The starting value is shared with
# Requirements; §16.3 requires its own sensitivity run before it is published.
threshold_models: 0.75            # primary, reported in the paper body
sweep_models: [0.70, 0.75, 0.80, 0.85]
syntax_gate: strict               # strict = require 1.0; no other value yet defined
kappa_pool: per_section           # per_section | pooled

# --- vmx (VMXGrading) ---
# No keys: coverage and referential integrity are plain look-ups. The VMX schema
# lives in evaluators/VMXGrading/rules.yaml.

# ── 5. Gold standards, shared by every grading module ────────────────────────
# Relative paths are taken from this file's directory.
gold:
  requirements: materials/G1-requirements.json
  structural: materials/G2-structural-model.puml
  behavioral: materials/G3-behavioral-model.puml
  domain: materials/M1a.json   # rubric traceability input; VMX Domain-Req-ID vocabulary

# ── 6. Pipeline analysis (pipeline/ package; not used by grading) ────────────
pipeline:
  modals: [shall, must, should, will, can, may]
  articles: [a, an, the]
  singularize_nouns: false
  spacy_model: en_core_web_sm
  split_identifiers: true
  keep_negation_cue_tokens: false
  non_negating_phrases:
    - no more than
    - not more than
    - no less than
    - not less than
    - no later than
    - no earlier than
    - no fewer than
    - no greater than
    - no longer than
    - at least
    - at most

  # Diagram validity (parse_check).
  parse_check:
    plantuml_jar: tools/plantuml.jar
    plantuml_cmd: plantuml
    java_cmd: java
    layout_smetana: true            # replacement for graphviz
    timeout_seconds: 60
    extra_args: []

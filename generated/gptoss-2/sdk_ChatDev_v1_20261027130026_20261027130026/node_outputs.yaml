      - type: text
        text: "**File: srs.md**\n\n# 1. Introduction\n### 1.1 Purpose\nThe purpose\
          \ of this Software Requirements Specification (SRS) is to define the functional\
          \ and non‑functional requirements for an Order Management System (OMS) that\
          \ supports customers, order staff, and accountants.\n\n### 1.2 Scope\nThe\
          \ OMS enables customers to browse products, place orders, and make payments;\
          \ order staff to receive, validate, fill, ship, and close orders; and accountants\
          \ to issue invoices and process payments. The system stores all necessary\
          \ data, enforces business rules, and records audit information.\n\n### 1.3\
          \ Definitions and acronyms\n- **Customer** – end‑user who purchases products.\
          \  \n- **OrderStaff** – internal employee who processes orders.  \n- **Accountant**\
          \ – internal employee who handles invoicing and payments.  \n- **DTO** –\
          \ Data Transfer Object.  \n- **TLS** – Transport Layer Security.\n\n# 2.\
          \ Overall description\n### 2.1 Product perspective\nThe OMS is a stand‑alone\
          \ web‑based application that persists data in a relational database and\
          \ exposes a RESTful API to client applications.\n\n### 2.2 Product functions\n\
          - Manage customer records (including optional bank account).  \n- Manage\
          \ product catalogue.  \n- Create, validate and track orders and order items.\
          \  \n- Issue invoices and record payments.  \n- Enforce status transitions\
          \ and business rules.  \n- Audit all status changes.\n\n### 2.3 User characteristics\n\
          - **Customer** – basic internet user, can view products and place orders.\
          \  \n- **OrderStaff** – trained staff, authorized to change order statuses.\
          \  \n- **Accountant** – trained staff, authorized to issue invoices and\
          \ confirm/reject payments.\n\n### 2.4 Assumptions and dependencies\n- The\
          \ system runs on a server with a SQL database.  \n- All users are authenticated\
          \ via an external identity provider.  \n- TLS 1.2+ is available for encrypted\
          \ communications.\n\n# 3. Requirements\n## 3.1 Functional requirements\n\
          \n| ID | User story |\n|----|------------|\n| **US-01** | As a **Customer**,\
          \ I want to register my personal details (name, address, phone), so that\
          \ the system can identify and contact me. |\n| **US-02** | As a **Customer**,\
          \ I want to add a single bank account to my profile (optional), so that\
          \ I can use it as a payment method. |\n| **US-03** | As a **Customer**,\
          \ I want to view product information (name, description, price, image),\
          \ so that I can decide what to buy. |\n| **US-04** | As a **Customer**,\
          \ I want to submit an order that contains at least one order item referencing\
          \ existing products and a payment method, so that I can purchase the items.\
          \ |\n| **US-05** | As an **OrderStaff**, I want to receive a submitted order\
          \ and set its status to *pending*, so that the order enters the processing\
          \ pipeline. |\n| **US-06** | As an **OrderStaff**, I want to mark a *pending*\
          \ order as *filled*, so that the items are ready for shipping. |\n| **US-07**\
          \ | As an **OrderStaff**, I want to decline a *pending* order, so that it\
          \ is closed without fulfillment. |\n| **US-08** | As an **OrderStaff**,\
          \ I want to ship a *filled* order, so that the customer receives the goods.\
          \ |\n| **US-09** | As an **Accountant**, I want to raise an invoice for\
          \ a *filled* or *shipped* order that has no invoice, so that the order can\
          \ be billed. |\n| **US-10** | As an **Accountant**, I want to submit a payment\
          \ against an *issued* invoice, so that the customer can settle the bill.\
          \ |\n| **US-11** | As an **Accountant**, I want to confirm a *pending* payment,\
          \ so that the invoice becomes *paid*. |\n| **US-12** | As an **Accountant**,\
          \ I want to reject a *pending* payment, so that the failed payment is recorded\
          \ and no further action is taken. |\n| **US-13** | As an **Accountant**,\
          \ I want to close a *shipped* order whose invoice is *paid*, so that the\
          \ order lifecycle ends. |\n\n### Acceptance criteria\n\n#### US-01 – Customer\
          \ registration\n- **US-01-AC01** (condition) – The system requires **name**,\
          \ **address**, and **phone**; any missing mandatory attribute causes the\
          \ registration request to be rejected.  \n- **US-01-AC02** (condition) –\
          \ All three attributes are stored as non‑null strings.  \n- **US-01-AC03**\
          \ (given_when_then) – Given a new registration request with all mandatory\
          \ fields, When the request is processed, Then a Customer record is created\
          \ and a unique Customer ID is returned.\n\n#### US-02 – Optional bank account\n\
          - **US-02-AC01** (condition) – A Customer may have **zero or one** BankAccount;\
          \ attempting to add a second bank account is rejected.  \n- **US-02-AC02**\
          \ (condition) – BankAccount stores **accountNumber** as a non‑empty string.\
          \  \n- **US-02-AC03** (given_when_then) – Given a Customer without a bank\
          \ account, When the Customer adds a bank account, Then the BankAccount is\
          \ stored and linked to the Customer.\n\n#### US-03 – Product catalogue\n\
          - **US-03-AC01** (condition) – Every Product must have **name**, **description**,\
          \ **price**, and **image**; missing any attribute causes the creation request\
          \ to be rejected.  \n- **US-03-AC02** (condition) – **price** is stored\
          \ as a decimal number with two fractional digits.  \n- **US-03-AC03** (given_when_then)\
          \ – Given a valid product definition, When the product is saved, Then it\
          \ is persisted and can be referenced by OrderItems.\n\n#### US-04 – Order\
          \ submission\n- **US-04-AC01** (condition) – An Order must reference **exactly\
          \ one** existing Customer, contain **≥ 1** OrderItem, and store a **paymentMethod**\
          \ (bank, card, cash).  \n- **US-04-AC02** (given_when_then) – Given a known\
          \ Customer and at least one OrderItem whose referenced Product exists, When\
          \ the Customer submits the order, Then the system creates an Order with\
          \ status *submitted*, sets **orderDate** to the submission date, and computes\
          \ **totalAmount** as Σ(quantity × unitPrice).  \n- **US-04-AC03** (given_when_then)\
          \ – Given an unknown Customer, When the Customer attempts to submit an order,\
          \ Then the request is rejected and no Order is created.  \n- **US-04-AC04**\
          \ (given_when_then) – Given an order with zero OrderItems, When the Customer\
          \ submits it, Then the request is rejected and no Order is created.  \n\
          - **US-04-AC05** (given_when_then) – Given an OrderItem that references\
          \ a non‑existent Product, When the order is submitted, Then the request\
          \ is rejected and no Order is created.  \n- **US-04-AC06** (condition) –\
          \ OrderItem is **composed** within its Order; deleting an Order removes\
          \ all its OrderItems.  \n- **US-04-AC07** (condition) – OrderItem cannot\
          \ be moved to another Order.\n\n#### US-05 – Receive order\n- **US-05-AC01**\
          \ (given_when_then) – Given an Order with status *submitted*, When OrderStaff\
          \ receives the order, Then the Order status becomes *pending*.  \n- **US-05-AC02**\
          \ (given_when_then) – Given an Order whose status is not *submitted*, When\
          \ OrderStaff attempts to receive it, Then the request is rejected and the\
          \ status remains unchanged.  \n- **US-05-AC03** (condition) – Allowed status\
          \ transition: *submitted* → *pending* only.\n\n#### US-06 – Fill order\n\
          - **US-06-AC01** (given_when_then) – Given a *pending* Order, When OrderStaff\
          \ marks it as *filled*, Then the Order status becomes *filled*.  \n- **US-06-AC02**\
          \ (given_when_then) – Given an Order not in *pending* status, When OrderStaff\
          \ attempts to fill it, Then the request is rejected and the status stays\
          \ unchanged.  \n- **US-06-AC03** (condition) – Allowed status transition:\
          \ *pending* → *filled* or *pending* → *closed* (decline).\n\n#### US-07\
          \ – Decline order\n- **US-07-AC01** (given_when_then) – Given a *pending*\
          \ Order, When OrderStaff declines it, Then the Order status becomes *closed*.\
          \  \n- **US-07-AC02** (given_when_then) – Given an Order not in *pending*\
          \ status, When OrderStaff attempts to decline it, Then the request is rejected\
          \ and the status stays unchanged.  \n\n#### US-08 – Ship order\n- **US-08-AC01**\
          \ (given_when_then) – Given a *filled* Order, When OrderStaff ships it,\
          \ Then the Order status becomes *shipped*.  \n- **US-08-AC02** (given_when_then)\
          \ – Given an Order not in *filled* status, When OrderStaff attempts to ship\
          \ it, Then the request is rejected and the status stays unchanged.  \n-\
          \ **US-08-AC03** (condition) – Shipping does **not** modify the status of\
          \ any associated Invoice or Payment.\n\n#### US-09 – Raise invoice\n- **US-09-AC01**\
          \ (condition) – An Invoice may be created only for an Order whose status\
          \ is *filled* or *shipped* and that has **no existing** Invoice.  \n- **US-09-AC02**\
          \ (given_when_then) – Given such an Order, When Accountant raises an invoice,\
          \ Then an Invoice is created with status *issued*, the supplied date, amount,\
          \ and paymentMethod, and linked to the Order.  \n- **US-09-AC03** (given_when_then)\
          \ – Given an Order already having an Invoice, When Accountant attempts to\
          \ raise another, Then the request is rejected.  \n- **US-09-AC04** (given_when_then)\
          \ – Given an Order with status *declined*, When Accountant attempts to raise\
          \ an invoice, Then the request is rejected.\n\n#### US-10 – Submit payment\n\
          - **US-10-AC01** (condition) – A Payment can be submitted only against an\
          \ Invoice with status *issued*.  \n- **US-10-AC02** (given_when_then) –\
          \ Given such an Invoice, When Accountant records a payment, Then a Payment\
          \ is created with status *pending* and the supplied date, amount, and paymentMethod.\
          \  \n- **US-10-AC03** (given_when_then) – Given an Invoice whose status\
          \ is *paid*, When a new payment is submitted, Then the request is rejected.\n\
          \n#### US-11 – Confirm payment\n- **US-11-AC01** (given_when_then) – Given\
          \ a Payment with status *pending* and its Invoice status *issued*, When\
          \ Accountant confirms the payment, Then the Payment status becomes *completed*\
          \ and the Invoice status becomes *paid*.  \n- **US-11-AC02** (condition)\
          \ – The Order status remains unchanged when its Invoice becomes *paid*.\
          \  \n- **US-11-AC03** (given_when_then) – Given a Payment whose status is\
          \ not *pending*, When Accountant attempts to confirm it, Then the request\
          \ is rejected and the status remains unchanged.\n\n#### US-12 – Reject payment\n\
          - **US-12-AC01** (given_when_then) – Given a Payment with status *pending*,\
          \ When Accountant rejects it, Then the Payment status becomes *failed*;\
          \ the Invoice and Order statuses stay unchanged.  \n- **US-12-AC02** (given_when_then)\
          \ – Given a Payment not in *pending* status, When Accountant attempts to\
          \ reject it, Then the request is rejected.\n\n#### US-13 – Close order\n\
          - **US-13-AC01** (condition) – An Order can be closed only when its status\
          \ is *shipped* **and** its associated Invoice status is *paid*.  \n- **US-13-AC02**\
          \ (given_when_then) – Given such an Order, When Accountant closes it, Then\
          \ the Order status becomes *closed*.  \n- **US-13-AC03** (given_when_then)\
          \ – Given a *shipped* Order whose Invoice is not *paid*, When Accountant\
          \ attempts to close it, Then the request is rejected and the Order status\
          \ stays *shipped*.  \n- **US-13-AC04** (given_when_then) – Given an Order\
          \ with status *closed*, any further status‑change attempts are ignored and\
          \ the status remains *closed*.\n\n#### Cross‑cutting functional constraints\
          \ (applied to all applicable stories)\n- **Condition** – All monetary values\
          \ (price, unit price, total amount, invoice amount, payment amount) are\
          \ stored as decimal numbers. (REQ‑F‑46)  \n- **Condition** – OrderStatus\
          \ is limited to *submitted*, *pending*, *filled*, *shipped*, *closed* (REQ‑F‑47).\
          \  \n- **Condition** – InvoiceStatus is limited to *issued*, *paid* (REQ‑F‑47).\
          \  \n- **Condition** – PaymentStatus is limited to *pending*, *completed*,\
          \ *failed* (REQ‑F‑47).  \n- **Condition** – PaymentMethod on Order, Invoice,\
          \ and Payment is limited to *bank*, *card*, *cash* (REQ‑F‑48).  \n- **Condition**\
          \ – Status changes must follow the allowed transition tables (REQ‑F‑49,\
          \ REQ‑F‑50).  \n\n## 3.2 Quality attributes\n### 3.2.1 Performance\n- **NFR-01**\
          \ – When a user submits an order containing up to 50 order items under normal\
          \ operating conditions, the system shall register the order and respond\
          \ within **2 seconds** for at least **95 %** of submissions. (REQ‑N‑01)\
          \  \n- **NFR-02** – Under normal operating conditions, the system shall\
          \ support at least **200 concurrent users** and at least **20 order submissions\
          \ per second** while meeting the response time of NFR‑01. (REQ‑N‑02)\n\n\
          ### 3.2.2 Security\n- **NFR-03** – The system shall authenticate every user\
          \ before granting access to any customer, order, invoice or payment data,\
          \ and shall reject **100 %** of unauthenticated requests. (REQ‑N‑05)  \n\
          - **NFR-04** – The system shall allow only users holding the **accountant**\
          \ role to confirm or reject a payment, and shall reject the same request\
          \ from any other user. (REQ‑N‑06)  \n- **NFR-05** – The system shall protect\
          \ customer personal data and bank account numbers by encrypting them in\
          \ transit with **TLS 1.2 or higher** and at rest. (REQ‑N‑07)\n\n### 3.2.3\
          \ Availability\n- **NFR-06** – The system shall be available for at least\
          \ **99.5 %** of each calendar month, excluding scheduled maintenance announced\
          \ at least **24 hours** in advance. (REQ‑N‑03)  \n- **NFR-07** – When a\
          \ server failure occurs, the system shall resume accepting requests within\
          \ **15 minutes** without losing any order, invoice or payment recorded before\
          \ the failure. (REQ‑N‑04)\n\n# 4. Verification\nVerification of each functional\
          \ requirement will be performed by automated acceptance‑test suites that\
          \ execute the Given‑When‑Then scenarios. Non‑functional requirements will\
          \ be verified by performance‑testing tools, security audits, and availability\
          \ monitoring dashboards.\n\n# 5. Supporting information\n- PlantUML structural\
          \ model: **structural.puml**  \n- PlantUML behavioral model: **behavioral.puml**\
          \  \n- Machine‑readable requirements list: **requirements.json**  \n- Traceability\
          \ matrix: **VMX.csv**  \n\n\n\n**File: structural.puml**\n\n@startuml structural\n\
          ' Enumerations\nenum OrderStatus {\n  submitted\n  pending\n  filled\n \
          \ shipped\n  closed\n}\nenum InvoiceStatus {\n  issued\n  paid\n}\nenum\
          \ PaymentStatus {\n  pending\n  completed\n  failed\n}\nenum PaymentMethod\
          \ {\n  bank\n  card\n  cash\n}\n\n' Domain classes\nclass Customer {\n \
          \ +String name\n  +String address\n  +String phone\n}\nclass BankAccount\
          \ {\n  +String accountNumber\n}\nclass Product {\n  +String name\n  +String\
          \ description\n  +Decimal price\n  +String imageUrl\n}\nclass Order {\n\
          \  +Date orderDate\n  +Decimal totalAmount\n  +OrderStatus status\n  +PaymentMethod\
          \ paymentMethod\n}\nclass OrderItem {\n  +Integer quantity\n  +Decimal unitPrice\n\
          }\nclass Invoice {\n  +Date date\n  +Decimal amount\n  +InvoiceStatus status\n\
          \  +PaymentMethod paymentMethod\n}\nclass Payment {\n  +Date date\n  +Decimal\
          \ amount\n  +PaymentStatus status\n  +PaymentMethod paymentMethod\n}\n\n\
          ' Relationships\nCustomer \"1\" o-- \"0..1\" BankAccount : has\nCustomer\
          \ \"1\" <-- \"0..*\" Order : places\nOrder \"1\" o-- \"0..1\" Invoice :\
          \ generates\nInvoice \"1\" o-- \"1..*\" Payment : records\nOrder \"1\" o--\
          \ \"1..*\" OrderItem : contains\nOrderItem \"1\" --> \"1\" Product : references\n\
          @enduml\n\n\n\n**File: behavioral.puml**\n\n@startuml behavioral\n' Swimlanes\n\
          |Customer|\nstart\n:SubmitOrder;\nif (Order valid?) then (yes)\n  :Create\
          \ Order [submitted];\nelse (no)\n  stop\nendif\n|OrderStaff|\nif (Order\
          \ status == submitted) then (yes)\n  :ReceiveOrder;\n  :Set status [pending];\n\
          else (no)\n  stop\nendif\nif (Order status == pending) then (yes)\n  split\n\
          \    :MarkOrderFilled;\n    :Set status [filled];\n  split again\n    :RaiseInvoice;\n\
          \    :Create Invoice [issued];\n  end split\nelse (no)\n  stop\nendif\n\
          if (Order status == filled) then (yes)\n  :ShipOrder;\n  :Set status [shipped];\n\
          else (no)\n  stop\nendif\n|Accountant|\nif (Invoice exists && Invoice status\
          \ == issued) then (yes)\n  :SubmitPayment;\n  :Create Payment [pending];\n\
          else (no)\n  stop\nendif\nif (Payment status == pending) then (yes)\n  if\
          \ (Confirm?) then (yes)\n    :ConfirmPayment;\n    :Set Payment status [completed];\n\
          \    :Set Invoice status [paid];\n  else (no)\n    :RejectPayment;\n   \
          \ :Set Payment status [failed];\n  endif\nelse (no)\n  stop\nendif\nif (Order\
          \ status == shipped && Invoice status == paid) then (yes)\n  :CloseOrder;\n\
          \  :Set Order status [closed];\nelse (no)\n  stop\nendif\nstop\n@enduml\n\

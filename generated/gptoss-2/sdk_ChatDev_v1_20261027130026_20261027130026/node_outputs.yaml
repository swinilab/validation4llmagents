              arguments: '{"content":"{\n  \"version\": \"1.1\",\n  \"updated\": \"2026-10-21\",\n  \"requirements\":
                [\n    {\n      \"id\": \"US-01\",\n      \"type\": \"functional\",\n      \"statement\":
                \"As a Customer, I want to register my personal details (name, address,
                phone) and optionally a bank account, so that the system can identify

          \ Availability shall be ≥ 99.5 % per calendar month, with scheduled maintenance\
          \ announced ≥ 24 h in advance. |\n\n*Note: The above 20 user stories collectively\
          \ cover all 50 domain functional requirements. Each story’s acceptance criteria\
          \ reference the specific domain rules they enforce.*\n\n## 3.2 Quality attributes\
          \  \n\n### 3.2.1 Performance  \n\n| ID | Statement |\n|----|-----------|\n\
          | **NFR-01** | When a user submits an order containing up to 50 order items\
          \ under normal operating conditions, the system shall register the order\
          \ and respond within **2 seconds** for at least **95 %** of submissions.\
          \ |\n| **NFR-02** | Under normal operating conditions, the system shall\
          \ support at least **200 concurrent users** and at least **20 order submissions\
          \ per second** while meeting the response time of NFR‑01. |\n\n### 3.2.2\
          \ Security  \n\n| ID | Statement |\n|----|-----------|\n| **NFR-03** | The\
          \ system shall authenticate every user before granting access to any customer,\
          \ order, invoice or payment data, and shall reject **100 %** of unauthenticated\
          \ requests. |\n| **NFR-04** | The system shall allow only users holding\
          \ the **accountant** role to confirm or reject a payment, and shall reject\
          \ the same request from any other user. |\n| **NFR-05** | The system shall\
          \ protect customer personal data and bank account numbers by encrypting\
          \ them in transit with **TLS 1.2 or higher** and at rest. |\n| **NFR-06**\
          \ | The system shall record the user and the time of every status change\
          \ of an order, an invoice and a payment, and shall retain these records\
          \ for at least **12 months**. |\n\n### 3.2.3 Availability  \n\n| ID | Statement\
          \ |\n|----|-----------|\n| **NFR-07** | When a server failure occurs, the\
          \ system shall resume accepting requests within **15 minutes** without losing\
          \ any order, invoice or payment recorded before the failure. |\n| **NFR-08**\
          \ | The system shall be available for at least **99.5 %** of each calendar\
          \ month, excluding scheduled maintenance announced at least **24 hours**\
          \ in advance. |\n\n# 4. Verification  \nEach functional requirement shall\
          \ be verified by automated acceptance‑test scripts that exercise the given‑when‑then\
          \ scenarios and check the condition‑type constraints. Non‑functional requirements\
          \ shall be verified by performance‑testing tools (e.g., JMeter), security\
          \ scans (e.g., OWASP ZAP) and availability monitoring (e.g., Prometheus\
          \ + Grafana).\n\n# 5. Supporting information  \n* PlantUML structural diagram\
          \ – **`structural.puml`**  \n* PlantUML behavioral diagram – **`behavioral.puml`**\
          \  \n* Machine‑readable requirement listing – **`requirements.json`**  \n\
          * Traceability matrix – **`VMX.csv`**  \n\n\n\n**File: `structural.puml`**\n\
          \n```plantuml\n@startuml structural\n\n' Enums for fixed value sets\nenum\
          \ OrderStatus {\n    submitted\n    pending\n    filled\n    shipped\n \
          \   closed\n}\nenum InvoiceStatus {\n    issued\n    paid\n}\nenum PaymentStatus\
          \ {\n    pending\n    completed\n    failed\n}\nenum PaymentMethod {\n \
          \   bank\n    card\n    cash\n}\n\n' Domain classes\nclass Customer {\n\
          \    +customerId : UUID\n    +name : String\n    +address : String\n   \
          \ +phone : String\n    +bankAccount : String <<optional, encrypted>>\n}\n\
          class Product {\n    +productId : UUID\n    +name : String\n    +description\
          \ : String\n    +price : Decimal(12,2)\n    +imageUrl : String\n}\nclass\
          \ Order {\n    +orderId : UUID\n    +orderDate : Date\n    +totalAmount\
          \ : Decimal(12,2)\n    +status : OrderStatus\n    +paymentMethod : PaymentMethod\n\
          }\nclass OrderItem {\n    +orderItemId : UUID\n    +quantity : Integer\n\
          \    +unitPrice : Decimal(12,2)\n}\nclass Invoice {\n    +invoiceId : UUID\n\
          \    +date : Date\n    +amount : Decimal(12,2)\n    +status : InvoiceStatus\n\
          \    +paymentMethod : PaymentMethod\n}\nclass Payment {\n    +paymentId\
          \ : UUID\n    +date : Date\n    +amount : Decimal(12,2)\n    +status : PaymentStatus\n\
          \    +paymentMethod : PaymentMethod\n}\nclass AuditLog {\n    +logId : UUID\n\
          \    +entity : String\n    +oldStatus : String\n    +newStatus : String\n\
          \    +userId : UUID\n    +timestamp : DateTime\n}\n\n' Relationships\nCustomer\
          \ \"1\" o-- \"0..*\" Order : places >\nOrder \"1\" o-- \"1..*\" OrderItem\
          \ : contains >\nOrderItem \"1\" --> \"1\" Product : references >\nOrder\
          \ \"1\" --> \"0..1\" Invoice : billed by >\nInvoice \"1\" o-- \"0..*\" Payment\
          \ : receives >\nInvoice \"1\" --> \"1\" Order : for >\nPayment \"1\" -->\
          \ \"1\" Invoice : for >\nAuditLog \"1\" --> \"1\" * : records >\n\n@enduml\n\
          ```\n\n**File: `behavioral.puml`**\n\n```plantuml\n@startuml behavioral\n\

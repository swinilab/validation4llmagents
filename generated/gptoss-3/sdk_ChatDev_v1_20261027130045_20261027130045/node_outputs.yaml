                BankAccount [0..1]\n}\n\nclass BankAccount {\n  +accountNumber: String\n  +bankName:
                String\n}\n\nclass Product {\n  +id: UUID\n  +name: String\n  +description:
                String\n  +price: Decimal\n  +imageUrl: String\n}\n\nclass Order {\n  +id:
                UUID\n  +orderDate: Date\n  +totalAmount: Decimal\n  +status: OrderStatus\n  +paymentMethod:
                PaymentMethod\n}\n\nclass OrderItem {\n  +quantity: Integer\n  +unitPrice:
                Decimal\n}\n\nclass Invoice {\n  +id: UUID\n  +date: Date\n  +amount:
                Decimal\n  +status: InvoiceStatus\n  +paymentMethod: PaymentMethod\n}\n\nclass
                Payment {\n  +id: UUID\n  +date: Date\n  +amount: Decimal\n  +status:
                PaymentStatus\n  +paymentMethod: PaymentMethod\n}\n\n'' Relationships\nCustomer
                \"1\" -- \"*\" Order : places \u003e\nOrder \"1\" *-- \"*\" OrderItem
                : contains \u003e\nOrderItem \"1\" --\u003e \"1\" Product : refers
                to \u003e\nOrder \"1\" o-- \"0..1\" Invoice : billed by \u003e\nInvoice
                \"1\" *-- \"*\" Payment : records \u003e\nCustomer \"1\" o-- \"0..1\"
                BankAccount : has \u003e\n@enduml","start_line":1}'

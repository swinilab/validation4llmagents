              arguments: '{"path":"srs.md","encoding":"utf-8","start_line":1,"end_line":1,"replacement":"#
                Software Requirements Specification (SRS)\n\n## 1. Introduction\n###
                1.1 Purpose\nThis document specifies the functional and non‑functional
                requirements for the Order Management System.\n\n### 1.2 Scope\nThe
                system enables Customers to browse products, place orders, make payments,
                and view invoices; OrderStaff to process orders; and Accountants to
                manage invoicing and payments.\n\n### 1.3 Definitions and acronyms\n-
                **Customer**: End‑user who purchases products.\n- **OrderStaff**:
                Internal staff handling order processing.\n- **Accountant**: Internal
                staff handling invoicing and payments.\n- **Order**, **Invoice**,
                **Payment**, **Product**, **BankAccount**: Domain entities.\n\n##
                2. Overall description\n### 2.1 Product perspective\nThe system is
                a standalone application interfacing with a relational database and
                exposing a REST API.\n\n### 2.2 Product functions\n- Manage customer
                records.\n- Manage product catalogue.\n- Process order lifecycle (submission
                → receipt → fulfillment → shipping → closure).\n- Generate invoices
                and record payments.\n\n### 2.3 User characteristics\n- Customers:
                basic web users, authenticated.\n- OrderStaff: staff with order‑processing
                privileges.\n- Accountant: staff with invoicing and payment privileges.\n\n###
                2.4 Assumptions and dependencies\n- TLS 1.2+ is available for secure
                communication.\n- The database supports decimal types.\n\n## 3. Requirements\n###
                3.1 Functional requirements\n#### US-01\n*As a **Customer**, I want
                to create and maintain my personal profile, so that the system can
                identify me and contact me when needed.*\n- **US-01-AC01** (condition):
                The profile shall store a name, an address and a phone number (REQ‑F‑01)
                and may store at most one bank account (REQ‑F‑02).\n- **US-01-AC02**
                (condition): All stored attributes are mandatory except the bank account
                (REQ‑F‑45).\n- **US-01-AC03** (given_when_then): Given a new profile
                request with all mandatory fields, when the system validates the data,
                then the profile is created and a confirmation is returned.\n\n####
                US-02\n*As an **OrderStaff**, I want to add new products to the catalogue,
                so that customers can order them.*\n- **US-02-AC01** (condition):
                Each product shall have a name, description, price and image (REQ‑F‑03)
                stored as decimal for price (REQ‑F‑46).\n- **US-02-AC02** (condition):
                All product attributes are mandatory (REQ‑F‑45).\n- **US-02-AC03**
                (given_when_then): Given a product creation request with valid data,
                when the system stores the product, then the product becomes available
                for order items.\n\n#### US-03\n*As a **Customer**, I want to submit
                an order containing one or more items and a payment method, so that
                I can purchase products.*\n- **US-03-AC01** (condition): An order
                shall reference exactly one known customer (REQ‑F‑08) and contain
                at least one order item (REQ‑F‑15).\n- **US-03-AC02** (condition):
                Every order item shall refer to an existing product (REQ‑F‑16) and
                store quantity, unit price and a reference to exactly one product
                (REQ‑F‑06).\n- **US-03-AC03** (given_when_then): Given a valid order
                submission, when the system records the order date as the submission
                date and computes the total amount as Σ(quantity × unit price) (REQ‑F‑17),
                then the order status is set to *submitted*.\n- **US-03-AC04** (given_when_then):
                Given an order submission where the customer is unknown, when the
                system validates the request, then the order is rejected and no record
                is created (REQ‑F‑14).\n- **US-03-AC05** (given_when_then): Given
                an order submission containing a non‑existent product, when the system
                validates the items, then the order is rejected and no record is created
                (REQ‑F‑16).\n\n#### US-04\n*As an **OrderStaff**, I want to receive
                a submitted order, so that it can be processed further.*\n- **US-04-AC01**
                (condition): The status of an order may change from *submitted* to
                *pending* only (REQ‑F‑49).\n- **US-04-AC02** (given_when_then): Given
                an order with status *submitted*, when OrderStaff selects “receive”,
                then the order status becomes *pending* (REQ‑F‑18).\n- **US-04-AC03**
                (given_when_then): Given an order whose status is not *submitted*,
                when OrderStaff attempts to receive it, then the request is rejected
                and the status remains unchanged (REQ‑F‑19).\n\n#### US-05\n*As an
                **OrderStaff**, I want to mark a pending order as filled, so that
                the items can be prepared for shipping.*\n- **US-05-AC01** (condition):
                Status may change from *pending* to *filled* (REQ‑F‑49).\n- **US-05-AC02**
                (given_when_then): Given a *pending* order, when OrderStaff selects
                “fill”, then the order status becomes *filled* (REQ‑F‑20).\n- **US-05-AC03**
                (given_when_then): Given an order whose status is not *pending*, when
                OrderStaff attempts to fill it, then the request is rejected and the
                status stays unchanged (REQ‑F‑21).\n\n#### US-06\n*As an **OrderStaff**,
                I want to decline a pending order, so that it does not proceed to
                fulfillment.*\n- **US-06-AC01** (condition): Status may change from
                *pending* to *closed* (REQ‑F‑49).\n- **US-06-AC02** (given_when_then):
                Given a *pending* order, when OrderStaff selects “decline”, then the
                order status becomes *closed* (REQ‑F‑22).\n- **US-06-AC03** (given_when_then):
                Given an order not in *pending* status, when OrderStaff attempts to
                decline it, then the request is rejected and the status remains unchanged
                (REQ‑F‑23).\n\n#### US-07\n*As an **OrderStaff**, I want to ship a
                filled order, so that the customer receives the goods.*\n- **US-07-AC01**
                (condition): Status may change from *filled* to *shipped* (REQ‑F‑49).\n-
                **US-07-AC02** (given_when_then): Given a *filled* order, when OrderStaff
                selects “ship”, then the order status becomes *shipped* (REQ‑F‑25).\n-
                **US-07-AC03** (given_when_then): Given an order whose status is not
                *filled*, when OrderStaff attempts to ship it, then the request is
                rejected and the status stays unchanged (REQ‑F‑26).\n\n#### US-08\n*As
                an **Accountant**, I want to raise an invoice for a filled or shipped
                order that has no invoice, so that the customer can be billed.*\n-
                **US-08-AC01** (condition): An invoice may be created only for orders
                with status *filled* or *shipped* (REQ‑F‑28) and only if the order
                does not already have an invoice (REQ‑F‑29).\n- **US-08-AC02** (condition):
                Invoice status is initially *issued* (REQ‑F‑28) and may change only
                to *paid* (REQ‑F‑50).\n- **US-08-AC03** (given_when_then): Given an
                eligible order, when Accountant creates the invoice with date, amount,
                payment method, then the invoice is linked to the order and its status
                is *issued*.\n- **US-08-AC04** (given_when_then): Given an order that
                is *declined*, when Accountant attempts to raise an invoice, then
                the request is rejected (REQ‑F‑24).\n- **US-08-AC05** (given_when_then):
                Given an order whose status is *submitted*, *pending* or *closed*,
                when Accountant attempts to raise an invoice, then the request is
                rejected (REQ‑F‑30).\n\n#### US-09\n*As an **Accountant**, I want
                to record a payment against an issued invoice, so that the invoice
                can be settled.*\n- **US-09-AC01** (condition): Payments may be recorded
                only against invoices with status *issued* (REQ‑F‑32) and the payment
                status starts as *pending* (REQ‑F‑35).\n- **US-09-AC02** (given_when_then):
                Given an invoice with status *issued*, when Accountant records a payment
                with date, amount and method, then a payment entity is created with
                status *pending*.\n- **US-09-AC03** (given_when_then): Given an invoice
                with status *paid*, when a payment is submitted, then the request
                is rejected (REQ‑F‑33).\n- **US-09-AC04** (given_when_then): Given
                a failed payment, when a further payment is submitted, then the new
                payment is created with status *pending* while the failed one remains
                *failed* (REQ‑F‑34).\n- **US-09-AC05** (given_when_then): Given a
                *pending* payment, when Accountant confirms it, then the payment status
                becomes *completed* (REQ‑F‑35) and the invoice status becomes *paid*
                (REQ‑F‑36).\n- **US-09-AC06** (given_when_then): Given a *pending*
                payment, when Accountant rejects it, then the payment status becomes
                *failed* (REQ‑F‑38) and invoice and order statuses remain unchanged.\n-
                **US-09-AC07** (condition): Payment status may change only from *pending*
                to *completed* or *failed* (REQ‑F‑50).\n\n#### US-10\n*As an **OrderStaff**,
                I want to close a shipped order whose invoice is paid, so that the
                order lifecycle is finished.*\n- **US-10-AC01** (condition): An order
                may change from *shipped* to *closed* only when its linked invoice
                status is *paid* (REQ‑F‑40).\n- **US-10-AC02** (given_when_then):
                Given a *shipped* order with a *paid* invoice, when OrderStaff selects
                “close”, then the order status becomes *closed* (REQ‑F‑40).\n- **US-10-AC03**
                (given_when_then): Given a *shipped* order whose invoice is not *paid*,
                when OrderStaff attempts to close it, then the request is rejected
                and the status stays unchanged (REQ‑F‑41).\n- **US-10-AC04** (given_when_then):
                Given an order whose invoice is *paid* but whose status is not *shipped*,
                when OrderStaff attempts to close it, then the request is rejected
                (REQ‑F‑42).\n- **US-10-AC05** (condition): Once an order reaches status
                *closed* it never changes again (REQ‑F‑44).\n\n### 3.2 Quality attributes\n####
                3.2.1 Performance\n- **NFR-01**: When a user submits an order containing
                up to 50 order items under normal operating conditions, the system
                shall register the order and respond within 2 seconds for at least
                95% of submissions. (REQ‑N‑01)\n- **NFR-02**: Under normal operating
                conditions, the system shall support at least 200 concurrent users
                and at least 20 order submissions per second while meeting the response
                time of REQ‑N‑01. (REQ‑N‑02)\n\n#### 3.2.2 Security\n- **NFR-03**:
                The system shall authenticate every user before granting access to
                any customer, order, invoice or payment data, and shall reject 100%
                of unauthenticated requests. (REQ‑N‑05)\n- **NFR-04**: The system
                shall allow only users holding the accountant role to confirm or reject
                a payment, and shall reject the same request from any other user.
                (REQ‑N‑06)\n- **NFR-05**: The system shall protect customer personal
                data and bank account numbers by encrypting them in transit with TLS
                1.2 or higher and at rest. (REQ‑N‑07)\n- **NFR-06**: The system shall
                record the user and the time of every status change of an order, an
                invoice and a payment, and shall retain these records for at least
                12 months. (REQ‑N‑08)\n\n#### 3.2.3 Availability\n- **NFR-07**: The
                system shall be available for at least 99.5% of each calendar month,
                excluding scheduled maintenance announced at least 24 hours in advance.
                (REQ‑N‑03)\n- **NFR-08**: When a server failure occurs, the system
                shall resume accepting requests within 15 minutes without losing any
                order, invoice or payment recorded before the failure. (REQ‑N‑04)\n\n##
                4. Verification\nVerification methods include unit testing, integration
                testing, performance testing, security testing and audit of audit‑trail
                logs.\n\n## 5. Supporting information\nAppendices, glossary, and reference
                documents.\n"}'

node_Chief Product Officer:
  node_id: Chief Product Officer
  node_type: agent
  predecessors_num: 4
  successors_num: 1
  results:
  - type: message
    payload:
      role: assistant
      content:
      - type: text
        text: "# Order Management System – User Manual  \n\n*Version 1.0 – Updated\
          \ 2026‑10‑27*  \n\n---  \n\n## 1. Introduction  \n\nThe **Order Management\
          \ System (OMS)** is a web‑based application that supports the complete lifecycle\
          \ of a purchase transaction:\n\n* **Customers** can register, browse products,\
          \ place orders, view invoices and submit payments.  \n* **Order Staff**\
          \ receive orders, validate them, move them through the fulfillment workflow\
          \ (pending → filled → shipped) and close orders.  \n* **Accountants** generate\
          \ invoices, confirm or reject payments, and close orders once shipping and\
          \ payment are complete.  \n\nAll data (customers, products, orders, invoices,\
          \ payments) is stored in a relational database and accessed through a secure\
          \ RESTful API. The system enforces the business rules defined in the SRS\
          \ (status transitions, multiplicities, mandatory attributes, permitted values,\
          \ etc.).  \n\n---  \n\n## 2. System Architecture Overview  \n\n```\n+----------------------+\
          \      +-------------------+      +-------------------+\n|  Front‑end (SPA)\
          \    | <--->|  API Server (FastAPI) | <--->|  PostgreSQL DB   |\n|  (React\
          \ / Vue)      |      |  (Python 3.11)    |      |  (Decimal fields)|\n+----------------------+\
          \      +-------------------+      +-------------------+\n```\n\n* The **API\
          \ Server** implements the functional requirements as HTTP endpoints.  \n\
          * The **Front‑end** is optional – the API can be exercised directly with\
          \ tools such as `curl` or Postman.  \n* The **Database** holds all persistent\
          \ entities (Customer, Product, Order, OrderItem, Invoice, Payment).  \n\n\
          ---  \n\n## 3. Prerequisites  \n\n| Item | Minimum version | Why needed\
          \ |\n|------|----------------|------------|\n| **Python** | 3.11 | Core\
          \ language for the API server |\n| **uv** (Python package manager) | latest\
          \ | Fast, reproducible env creation |\n| **PostgreSQL** | 13 | Relational\
          \ DB with decimal support |\n| **Git** | any | To clone the repository |\n\
          | **Docker (optional)** | 20.10+ | Run the whole stack in containers |\n\
          \n---  \n\n## 4. Installation  \n\n### 4.1 Clone the repository  \n\n```bash\n\
          git clone https://github.com/your-org/oms.git\ncd oms\n```\n\n### 4.2 Create\
          \ a Python virtual environment using **uv**  \n\n```bash\nuv venv create\
          \ --python 3.11 .venv\nsource .venv/bin/activate\n```\n\n### 4.3 Install\
          \ the required packages  \n\n```bash\nuv pip install -r requirements.txt\n\
          ```\n\nThe `requirements.txt` contains (example):\n\n```\nfastapi\nuvicorn[standard]\n\
          SQLAlchemy\npsycopg2-binary\npydantic\npython-dotenv\ncryptography   # for\
          \ TLS/at‑rest encryption\n```\n\n### 4.4 Configure the database  \n\n1.\
          \ Create a PostgreSQL database (e.g., `oms_db`).  \n2. Copy the example\
          \ environment file and fill in your credentials:  \n\n```bash\ncp .env.example\
          \ .env\n# Edit .env\n# DATABASE_URL=postgresql://oms_user:secret@localhost/oms_db\n\
          # JWT_SECRET=your‑jwt‑secret\n# TLS_CERT=path/to/cert.pem\n# TLS_KEY=path/to/key.pem\n\
          ```\n\n3. Run the schema migration (SQL script located in `migrations/initial.sql`):\
          \  \n\n```bash\npsql $DATABASE_URL < migrations/initial.sql\n```\n\n###\
          \ 4.5 Start the API server  \n\n```bash\nuvicorn oms.main:app --host 0.0.0.0\
          \ --port 8000 --reload\n```\n\nThe service will be reachable at `https://localhost:8000`\
          \ (TLS enforced).  \n\n---  \n\n## 5. Main Functionalities  \n\nBelow is\
          \ a concise “role‑action” view of the system. Each action corresponds to\
          \ one or more API endpoints (documented in `docs/openapi.yaml`).  \n\n|\
          \ Role | Capability (User Story) | Typical API Endpoint(s) |\n|------|--------------------------|--------------------------|\n\
          | **Customer** | Register personal details (name, address, phone) | `POST\
          \ /customers` |\n| **Customer** | Optionally add a bank account | `POST\
          \ /customers/{id}/bank-account` |\n| **Customer** | Browse product catalog\
          \ | `GET /products` |\n| **Customer** | Submit an order (one‑plus items,\
          \ payment method) | `POST /orders` |\n| **Customer** | View own orders,\
          \ invoices, payments | `GET /customers/{id}/orders` |\n| **Customer** |\
          \ Submit a payment for an issued invoice | `POST /invoices/{id}/payments`\
          \ |\n| **OrderStaff** | Receive a submitted order (status → pending) | `PATCH\
          \ /orders/{id}/receive` |\n| **OrderStaff** | Mark pending order as filled\
          \ | `PATCH /orders/{id}/fill` |\n| **OrderStaff** | Ship a filled order\
          \ | `PATCH /orders/{id}/ship` |\n| **OrderStaff** | Decline a pending order\
          \ (status → closed) | `PATCH /orders/{id}/decline` |\n| **OrderStaff** |\
          \ Close a shipped order after invoice is paid | `PATCH /orders/{id}/close`\
          \ |\n| **Accountant** | Raise an invoice for a filled/shipped order | `POST\
          \ /orders/{id}/invoice` |\n| **Accountant** | Confirm a pending payment\
          \ (status → completed, invoice → paid) | `PATCH /payments/{id}/confirm`\
          \ |\n| **Accountant** | Reject a pending payment (status → failed) | `PATCH\
          \ /payments/{id}/reject` |\n\nAll status transitions are validated against\
          \ the permitted state‑change matrix (see SRS – REQ‑F‑49 / REQ‑F‑50).  \n\
          \n---  \n\n## 6. Using the API  \n\n### 6.1 Authentication  \n\nThe API\
          \ uses **JWT Bearer tokens**. Obtain a token by logging in:\n\n```bash\n\
          curl -X POST https://localhost:8000/auth/login \\\n  -H \"Content-Type:\
          \ application/json\" \\\n  -d '{\"username\":\"alice\",\"password\":\"secret\"\
          }'\n```\n\nInclude the token in subsequent calls:\n\n```\nAuthorization:\
          \ Bearer <jwt-token>\n```\n\nOnly users with the **accountant** role may\
          \ call the payment‑confirm/reject endpoints (enforced by middleware – see\
          \ REQ‑N‑04).  \n\n### 6.2 Example: Customer places an order  \n\n```bash\n\
          curl -X POST https://localhost:8000/orders \\\n  -H \"Authorization: Bearer\
          \ $TOKEN\" \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\n   \
          \     \"customer_id\": 42,\n        \"payment_method\": \"card\",\n    \
          \    \"items\": [\n          {\"product_id\": 7, \"quantity\": 2, \"unit_price\"\
          : \"19.99\"},\n          {\"product_id\": 3, \"quantity\": 1, \"unit_price\"\
          : \"45.00\"}\n        ]\n      }'\n```\n\n* The system validates that the\
          \ customer exists, that each `product_id` is valid, that at least one item\
          \ is present, and that the payment method is one of `bank|card|cash`.  \n\
          * On success it returns `201 Created` with the new order ID and a status\
          \ of **submitted**.  \n\n### 6.3 Example: Accountant raises an invoice \
          \ \n\n```bash\ncurl -X POST https://localhost:8000/orders/123/invoice \\\
          \n  -H \"Authorization: Bearer $ACC_TOKEN\" \\\n  -H \"Content-Type: application/json\"\
          \ \\\n  -d '{\n        \"date\": \"2026-10-27\",\n        \"amount\": \"\
          84.98\",\n        \"payment_method\": \"bank\",\n        \"status\": \"\
          issued\"\n      }'\n```\n\nThe request fails if the order is not in **filled**\
          \ or **shipped** status, or if an invoice already exists (REQ‑F‑29).  \n\
          \n---  \n\n## 7. Running the System in Docker (optional)  \n\nA Docker compose\
          \ file (`docker-compose.yml`) is provided for quick start:\n\n```bash\n\
          docker compose up -d\n```\n\nIt starts three containers:\n\n1. **db** –\
          \ PostgreSQL with persisted volume.  \n2. **api** – The FastAPI server (built\
          \ from the Dockerfile).  \n3. **frontend** – Optional React UI (served on\
          \ port 3000).  \n\nAll containers share a private network; the API is exposed\
          \ on `https://localhost:8443` (TLS termination handled by the container).\
          \  \n\n---  \n\n## 8. Testing  \n\n### 8.1 Unit / Integration Tests  \n\n\
          The repository contains a `tests/` folder with **pytest** tests covering:\n\
          \n* Validation of mandatory attributes (REQ‑F‑45).  \n* Status‑transition\
          \ rules (REQ‑F‑49, REQ‑F‑50).  \n* Payment method enumeration (REQ‑F‑48).\
          \  \n* Concurrency and performance expectations (NFR‑01, NFR‑02) – simulated\
          \ with `locust`.  \n\nRun tests with:\n\n```bash\npytest -v\n```\n\n###\
          \ 8.2 Load / Performance Test  \n\nA `locustfile.py` script exercises the\
          \ “order submission” endpoint with up to 50 items per order.  \n\n```bash\n\
          locust -f locustfile.py --headless -u 200 -r 20 --run-time 1m\n```\n\nVerify\
          \ that 95 % of requests complete within 2 seconds (NFR‑01).  \n\n---  \n\
          \n## 9. Security & Compliance  \n\n* **TLS 1.2+** is enforced for all HTTP\
          \ traffic (see `uvicorn` launch flags).  \n* Sensitive fields (customer\
          \ personal data, bank account numbers) are encrypted at rest using **AES‑256**\
          \ (handled by the `cryptography` library).  \n* Role‑based access control\
          \ (RBAC) is implemented in the `security` middleware; attempts to invoke\
          \ accountant‑only actions from other roles are rejected with `403 Forbidden`\
          \ (REQ‑N‑06).  \n\n---  \n\n## 10. Maintenance & Operations  \n\n| Task\
          \ | Recommended Frequency | Tool |\n|------|-----------------------|------|\n\
          | Database backup | Daily | `pg_dump` + automated storage |\n| TLS certificate\
          \ rotation | Before expiry (≤ 30 days) | `certbot` or manual replacement\
          \ |\n| Application log rotation | Weekly | `logrotate` (Docker logs collected\
          \ via `json-file` driver) |\n| Dependency updates | Monthly | `uv lock --upgrade`\
          \ then redeploy |\n| Health checks | Continuous (via `/health` endpoint)\
          \ | Kubernetes / Docker health probes |\n\n---  \n\n## 11. FAQ  \n\n**Q:**\
          \ *Can an order be edited after submission?*  \n**A:** No. Once an order\
          \ is stored with status **submitted**, its items are immutable (REQ‑F‑07).\
          \  \n\n**Q:** *What happens if the server crashes while processing an order?*\
          \  \n**A:** All writes are performed inside database transactions; on restart\
          \ the system resumes with the last committed state, satisfying REQ‑N‑04.\
          \  \n\n**Q:** *Is it possible to ship an order before an invoice is issued?*\
          \  \n**A:** Yes. Shipping and invoicing are independent (REQ‑F‑31).  \n\n\
          ---  \n\n## 12. Contact & Support  \n\n* **Product Owner:** Jane Doe – `jane.doe@chatdev.com`\
          \  \n* **Technical Lead:** John Smith – `john.smith@chatdev.com`  \n\nFor\
          \ bug reports, open a GitHub issue with the label `bug`. For feature requests,\
          \ use the label `enhancement`.  \n\n---  \n\n*End of Manual*  "

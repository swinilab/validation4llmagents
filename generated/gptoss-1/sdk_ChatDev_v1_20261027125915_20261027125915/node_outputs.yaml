node_Programmer Coding:
  node_id: Programmer Coding
  node_type: agent
  predecessors_num: 2
  successors_num: 1
  results:
  - type: message
    payload:
      role: assistant
      content:
      - type: text
        text: "**File: `srs.md`**\n\n# 1. Introduction\n### 1.1 Purpose\nThe purpose\
          \ of this Software Requirements Specification (SRS) is to define, in a clear\
          \ and traceable manner, the functional and non‑functional requirements for\
          \ the **Order Management System (OMS)**. The document serves as the definitive\
          \ reference for designers, developers, testers, and stakeholders.\n\n###\
          \ 1.2 Scope\nThe OMS enables customers to browse products, place orders,\
          \ and make payments; order staff to receive, fulfil, ship, and close orders;\
          \ and accountants to raise invoices and confirm or reject payments. The\
          \ system stores and manages customers, products, orders, invoices, and payments\
          \ while enforcing business rules and security constraints.\n\n### 1.3 Definitions\
          \ and Acronyms\n| Term | Definition |\n|------|------------|\n| **Customer**\
          \ | External user who purchases products. |\n| **OrderStaff** | Internal\
          \ staff responsible for order processing. |\n| **Accountant** | Internal\
          \ staff responsible for invoicing and payment handling. |\n| **Order** |\
          \ A request submitted by a Customer that contains one or more OrderItems.\
          \ |\n| **Invoice** | A billing document generated for an Order. |\n| **Payment**\
          \ | A monetary transaction made against an Invoice. |\n| **Status** | The\
          \ current lifecycle state of an Order, Invoice, or Payment. |\n| **PaymentMethod**\
          \ | The channel used for payment – *bank*, *card*, or *cash*. |\n| **NFR**\
          \ | Non‑functional requirement. |\n| **US** | User story (functional requirement).\
          \ |\n\n# 2. Overall description\n### 2.1 Product perspective\nThe OMS is\
          \ a standalone web‑based application that persists data in a relational\
          \ database. It interacts with external services only for TLS‑protected communication\
          \ and optional payment gateways.\n\n### 2.2 Product functions\n* Manage\
          \ customers, products, and bank accounts.  \n* Allow customers to submit\
          \ orders containing order items.  \n* Enable order staff to receive, validate,\
          \ fill, ship, and close orders.  \n* Allow accountants to raise invoices,\
          \ record payments, and confirm or reject payments.  \n* Enforce business\
          \ rules concerning statuses, multiplicities, and permitted values.  \n\n\
          ### 2.3 User characteristics\n| Role | Typical expertise |\n|------|-------------------|\n\
          | Customer | Basic web navigation, no technical knowledge required. |\n\
          | OrderStaff | Familiar with order processing workflows; basic data entry\
          \ skills. |\n| Accountant | Familiar with invoicing and payment reconciliation;\
          \ understands status lifecycles. |\n\n### 2.4 Assumptions and dependencies\n\
          * The system runs on a server that supports Python 3.12 and a PostgreSQL\
          \ database.  \n* TLS 1.2+ is available for all network communication.  \n\
          * Users are authenticated by an external identity provider (not in scope).\
          \  \n\n# 3. Requirements\n## 3.1 Functional requirements\n| ID | User story\
          \ | Acceptance criteria |\n|----|------------|----------------------|\n\
          | **US-01** | As a **Customer**, I want to register my personal data (name,\
          \ address, phone) so that the system can identify me for future orders.\
          \ | **US-01-AC01** (condition) – All three attributes are mandatory and\
          \ stored as non‑empty strings. <br> **US-01-AC02** (condition) – The system\
          \ rejects a registration if any mandatory attribute is missing. <br> **US-01-AC03**\
          \ (given_when_then) – Given a valid registration request, When the system\
          \ processes it, Then a new Customer record is created and the user receives\
          \ a confirmation. |\n| **US-02** | As a **Customer**, I want to optionally\
          \ add a single bank account so that I can pay by bank transfer. | **US-02-AC01**\
          \ (condition) – At most one BankAccount may be linked to a Customer. <br>\
          \ **US-02-AC02** (condition) – The bank account fields (accountNumber, routingNumber)\
          \ are mandatory when a BankAccount is provided. <br> **US-02-AC03** (given_when_then)\
          \ – Given a Customer with no BankAccount, When the Customer adds a bank\
          \ account, Then the account is stored and linked to the Customer. |\n| **US-03**\
          \ | As a **Customer**, I want to browse products that have a name, description,\
          \ price and image so that I can decide what to buy. | **US-03-AC01** (condition)\
          \ – All four attributes are mandatory; price is a decimal. <br> **US-03-AC02**\
          \ (condition) – The system rejects a Product creation if any mandatory attribute\
          \ is missing. <br> **US-03-AC03** (given_when_then) – Given a valid Product,\
          \ When the product is stored, Then it becomes searchable by all users. |\n\
          | **US-04** | As a **Customer**, I want to submit an order that contains\
          \ at least one order item referencing existing products so that I can purchase\
          \ them. | **US-04-AC01** (condition) – An Order must reference exactly one\
          \ existing Customer. <br> **US-04-AC02** (condition) – Each OrderItem must\
          \ reference exactly one existing Product. <br> **US-04-AC03** (given_when_then)\
          \ – Given a known Customer and existing Products, When the Customer submits\
          \ the order, Then the Order is stored with status *submitted* and the total\
          \ amount is computed as Σ(quantity × unitPrice). |\n| **US-05** | As a **Customer**,\
          \ I want the system to reject my order if the Customer is unknown, the order\
          \ has no items, or any referenced product does not exist, so that only valid\
          \ orders are recorded. | **US-05-AC01** (given_when_then) – Given an unknown\
          \ Customer, When an order is submitted, Then the system returns an error\
          \ and no Order is created. <br> **US-05-AC02** (given_when_then) – Given\
          \ an order with zero OrderItems, When the order is submitted, Then the system\
          \ returns an error and no Order is created. <br> **US-05-AC03** (given_when_then)\
          \ – Given an OrderItem that references a non‑existent Product, When the\
          \ order is submitted, Then the system returns an error and no Order is created.\
          \ |\n| **US-06** | As an **OrderStaff**, I want to receive a submitted order\
          \ so that it moves to *pending* and can be processed. | **US-06-AC01** (condition)\
          \ – Status transition *submitted* → *pending* is allowed. <br> **US-06-AC02**\
          \ (given_when_then) – Given an Order in *submitted* status, When OrderStaff\
          \ selects *Receive*, Then the Order status becomes *pending*. <br> **US-06-AC03**\
          \ (given_when_then) – Given an Order not in *submitted* status, When OrderStaff\
          \ attempts *Receive*, Then the system rejects the request and the status\
          \ remains unchanged. |\n| **US-07** | As an **OrderStaff**, I want to mark\
          \ a pending order as filled so that it can be shipped later. | **US-07-AC01**\
          \ (condition) – Status transition *pending* → *filled* is allowed. <br>\
          \ **US-07-AC02** (given_when_then) – Given an Order in *pending* status,\
          \ When *Mark Filled* is executed, Then the Order status becomes *filled*.\
          \ <br> **US-07-AC03** (given_when_then) – Given an Order not in *pending*\
          \ status, When *Mark Filled* is attempted, Then the request is rejected\
          \ and the status stays unchanged. |\n| **US-08** | As an **OrderStaff**,\
          \ I want to decline a pending order so that it becomes *closed* and no further\
          \ processing occurs. | **US-08-AC01** (condition) – Status transition *pending*\
          \ → *closed* is allowed. <br> **US-08-AC02** (given_when_then) – Given an\
          \ Order in *pending* status, When *Decline* is chosen, Then the Order status\
          \ becomes *closed*. <br> **US-08-AC03** (given_when_then) – Given an Order\
          \ not in *pending* status, When *Decline* is attempted, Then the request\
          \ is rejected. |\n| **US-09** | As an **OrderStaff**, I want to ship a filled\
          \ order so that its status becomes *shipped*. | **US-09-AC01** (condition)\
          \ – Status transition *filled* → *shipped* is allowed. <br> **US-09-AC02**\
          \ (given_when_then) – Given an Order in *filled* status, When *Ship* is\
          \ executed, Then the Order status becomes *shipped*. <br> **US-09-AC03**\
          \ (given_when_then) – Given an Order not in *filled* status, When *Ship*\
          \ is attempted, Then the request is rejected. |\n| **US-10** | As an **Accountant**,\
          \ I want to raise an invoice for a filled or shipped order that has no invoice\
          \ yet so that the customer can be billed. | **US-10-AC01** (condition) –\
          \ An Invoice may be created only for Orders with status *filled* or *shipped*\
          \ and only if no Invoice exists for that Order. <br> **US-10-AC02** (condition)\
          \ – Invoice status is initially *issued*. <br> **US-10-AC03** (given_when_then)\
          \ – Given a qualifying Order, When the Accountant creates an Invoice with\
          \ date, amount, payment method, Then an Invoice record linked to the Order\
          \ is stored with status *issued*. |\n| **US-11** | As an **Accountant**,\
          \ I want the system to reject attempts to raise a second invoice for the\
          \ same order or to raise an invoice for an order whose status is *submitted*,\
          \ *pending* or *closed*. | **US-11-AC01** (given_when_then) – Given an Order\
          \ that already has an Invoice, When the Accountant tries to raise another\
          \ Invoice, Then the request is rejected. <br> **US-11-AC02** (given_when_then)\
          \ – Given an Order in *submitted*, *pending* or *closed* status, When the\
          \ Accountant tries to raise an Invoice, Then the request is rejected. |\n\
          | **US-12** | As a **Customer**, I want to submit a payment against an *issued*\
          \ invoice so that the invoice can be settled. | **US-12-AC01** (condition)\
          \ – Payment may be created only for Invoices with status *issued*. <br>\
          \ **US-12-AC02** (condition) – New Payment status is *pending*. <br> **US-12-AC03**\
          \ (given_when_then) – Given an *issued* Invoice, When the Customer submits\
          \ a Payment (date, amount, method), Then a Payment record linked to the\
          \ Invoice is stored with status *pending*. |\n| **US-13** | As a **Customer**,\
          \ I want the system to reject a payment against a *paid* invoice. | **US-13-AC01**\
          \ (given_when_then) – Given an Invoice with status *paid*, When the Customer\
          \ attempts to submit a Payment, Then the request is rejected. |\n| **US-14**\
          \ | As a **Customer**, I want to submit a further payment if a previous\
          \ payment failed, without losing the failed record. | **US-14-AC01** (condition)\
          \ – A new Payment may be created for an Invoice that already has a Payment\
          \ with status *failed*. <br> **US-14-AC02** (given_when_then) – Given an\
          \ Invoice with a *failed* Payment, When the Customer submits another Payment,\
          \ Then a new Payment record with status *pending* is created while the failed\
          \ record remains unchanged. |\n| **US-15** | As an **Accountant**, I want\
          \ to confirm a pending payment so that the payment becomes *completed* and\
          \ the related invoice becomes *paid*. | **US-15-AC01** (condition) – Payment\
          \ status transition *pending* → *completed* is allowed. <br> **US-15-AC02**\
          \ (condition) – When a Payment for an *issued* Invoice is confirmed, the\
          \ Invoice status changes to *paid*. <br> **US-15-AC03** (given_when_then)\
          \ – Given a *pending* Payment, When the Accountant confirms it, Then the\
          \ Payment status becomes *completed* and the linked Invoice status becomes\
          \ *paid*. |\n| **US-16** | As an **Accountant**, I want to reject a pending\
          \ payment so that the payment status becomes *failed* while the invoice\
          \ and order remain unchanged. | **US-16-AC01** (condition) – Payment status\
          \ transition *pending* → *failed* is allowed. <br> **US-16-AC02** (given_when_then)\
          \ – Given a *pending* Payment, When the Accountant rejects it, Then the\
          \ Payment status becomes *failed* and the Invoice and Order statuses stay\
          \ as they were. |\n| **US-17** | As an **Accountant**, I want the system\
          \ to reject confirmation or rejection of a payment that is not *pending*.\
          \ | **US-17-AC01** (given_when_then) – Given a Payment with status *completed*\
          \ or *failed*, When the Accountant attempts to confirm or reject it, Then\
          \ the request is rejected and the status remains unchanged. |\n| **US-18**\
          \ | As an **OrderStaff**, I want to close a shipped order whose invoice\
          \ is paid so that the order lifecycle ends. | **US-18-AC01** (condition)\
          \ – Status transition *shipped* → *closed* is allowed only if the linked\
          \ Invoice status is *paid*. <br> **US-18-AC02** (given_when_then) – Given\
          \ an Order in *shipped* with a *paid* Invoice, When *Close* is executed,\
          \ Then the Order status becomes *closed*. |\n| **US-19** | As an **OrderStaff**,\
          \ I want the system to reject closing a shipped order whose invoice is not\
          \ paid, or closing an order whose invoice is paid but whose order status\
          \ is not shipped. | **US-19-AC01** (given_when_then) – Given an Order in\
          \ *shipped* with an Invoice not *paid*, When *Close* is attempted, Then\
          \ the request is rejected. <br> **US-19-AC02** (given_when_then) – Given\
          \ an Order with a *paid* Invoice but status not *shipped*, When *Close*\
          \ is attempted, Then the request is rejected. |\n| **US-20** | As any user,\
          \ I want the system to prevent any status change on a *closed* order, invoice,\
          \ or payment. | **US-20-AC01** (condition) – Once an entity reaches *closed*\
          \ (Order) or *paid* (Invoice) or *completed*/*failed* (Payment), its status\
          \ is immutable. <br> **US-20-AC02** (given_when_then) – Given a *closed*\
          \ Order, When any user attempts a status transition, Then the request is\
          \ rejected. |\n| **US-21** | As a **System**, I want every attribute (except\
          \ optional bank account) to be mandatory and validated on creation so that\
          \ data quality is guaranteed. | **US-21-AC01** (condition) – All mandatory\
          \ attributes must be non‑empty and of correct type (e.g., decimal for monetary\
          \ values). <br> **US-21-AC02** (given_when_then) – Given a creation request\
          \ missing any mandatory attribute, When the request is processed, Then the\
          \ system rejects it with an error. |\n| **US-22** | As a **System**, I want\
          \ monetary values to be stored as decimal numbers to avoid rounding errors.\
          \ | **US-22-AC01** (condition) – Price, unit price, total amount, invoice\
          \ amount, and payment amount are stored using a decimal type with at least\
          \ two fractional digits. |\n| **US-23** | As a **System**, I want the allowed\
          \ status values and payment methods to be restricted to the enumerated sets\
          \ defined in the domain. | **US-23-AC01** (condition) – Order status ∈ {submitted,\
          \ pending, filled, shipped, closed}. <br> **US-23-AC02** (condition) – Invoice\
          \ status ∈ {issued, paid}. <br> **US-23-AC03** (condition) – Payment status\
          \ ∈ {pending, completed, failed}. <br> **US-23-AC04** (condition) – Payment\
          \ method ∈ {bank, card, cash}. |\n| **US-24** | As a **System**, I want\
          \ status transitions to be limited to the allowed sequences so that the\
          \ lifecycle is predictable. | **US-24-AC01** (condition) – Order: submitted\
          \ → pending → filled → shipped → closed (or submitted → pending → closed).\
          \ <br> **US-24-AC02** (condition) – Invoice: issued → paid. <br> **US-24-AC03**\
          \ (condition) – Payment: pending → completed OR pending → failed. |\n\n\
          *The above 24 user stories together realise all 50 functional domain requirements.\
          \ Acceptance criteria reference the specific rules (e.g., multiplicities,\
          \ status changes) that were originally expressed as REQ‑F‑xx.*\n\n## 3.2\
          \ Quality attributes\n### 3.2.1 Performance\n| ID | Statement |\n|----|-----------|\n\
          | **NFR-01** | **REQ‑N‑01** When a user submits an order containing up to\
          \ 50 order items under normal operating conditions, the system shall register\
          \ the order and respond within 2 seconds for at least 95 % of submissions.\
          \ |\n| **NFR-02** | **REQ‑N‑02** Under normal operating conditions, the\
          \ system shall support at least 200 concurrent users and at least 20 order\
          \ submissions per second while meeting the response time of NFR‑01. |\n\n\
          ### 3.2.2 Security\n| ID | Statement |\n|----|-----------|\n| **NFR-03**\
          \ | **REQ‑N‑05** The system shall authenticate every user before granting\
          \ access to any customer, order, invoice or payment data, and shall reject\
          \ 100 % of unauthenticated requests. |\n| **NFR-04** | **REQ‑N‑06** The\
          \ system shall allow only users holding the accountant role to confirm or\
          \ reject a payment, and shall reject the same request from any other user.\
          \ |\n| **NFR-05** | **REQ‑N‑07** The system shall protect customer personal\
          \ data and bank account numbers by encrypting them in transit with TLS 1.2\
          \ or higher and at rest. |\n| **NFR-06** | **REQ‑N‑08** The system shall\
          \ record the user and the time of every status change of an order, an invoice\
          \ and a payment, and shall retain these records for at least 12 months.\
          \ |\n\n### 3.2.3 Availability\n| ID | Statement |\n|----|-----------|\n\
          | **NFR-07** | **REQ‑N‑03** The system shall be available for at least 99.5 %\
          \ of each calendar month, excluding scheduled maintenance announced at least\
          \ 24 hours in advance. |\n| **NFR-08** | **REQ‑N‑04** When a server failure\
          \ occurs, the system shall resume accepting requests within 15 minutes without\
          \ losing any order, invoice or payment recorded before the failure. |\n\n\
          # 4. Verification\nVerification of each functional requirement shall be\
          \ performed by automated unit and integration tests that exercise the given‑when‑then\
          \ scenarios and validate the condition constraints. Non‑functional requirements\
          \ shall be verified by performance load testing, security penetration testing,\
          \ and availability monitoring as described in the test plan.\n\n# 5. Supporting\
          \ information\n* Glossary of terms (see Clause 1.3).  \n* References to\
          \ regulatory standards for data protection (e.g., GDPR).  \n* Architecture\
          \ diagrams (see `structural.puml` and `behavioral.puml`).  \n\n---  \n*All\
          \ identifiers used in this document correspond to entries in `requirements.json`\
          \ and traceability matrix `VMX.csv`.*  \n\n\n\n**File: `structural.puml`**\n\
          \n@startuml structural\n' Enumerations\nenum OrderStatus {\n    submitted\n\
          \    pending\n    filled\n    shipped\n    closed\n}\nenum InvoiceStatus\
          \ {\n    issued\n    paid\n}\nenum PaymentStatus {\n    pending\n    completed\n\
          \    failed\n}\nenum PaymentMethod {\n    bank\n    card\n    cash\n}\n\n\
          ' Domain classes\nclass Customer {\n    +String name\n    +String address\n\
          \    +String phoneNumber\n}\nclass BankAccount {\n    +String accountNumber\n\
          \    +String routingNumber\n}\nclass Product {\n    +String name\n    +String\
          \ description\n    +Decimal price\n    +String imageUrl\n}\nclass Order\
          \ {\n    +Date orderDate\n    +Decimal totalAmount\n    +OrderStatus status\n\
          \    +PaymentMethod paymentMethod\n}\nclass OrderItem {\n    +int quantity\n\
          \    +Decimal unitPrice\n}\nclass Invoice {\n    +Date date\n    +Decimal\
          \ amount\n    +InvoiceStatus status\n    +PaymentMethod paymentMethod\n\
          }\nclass Payment {\n    +Date date\n    +Decimal amount\n    +PaymentStatus\
          \ status\n    +PaymentMethod paymentMethod\n}\n\n' Relationships\nCustomer\
          \ \"1\" o-- \"0..1\" BankAccount : has\nCustomer \"1\" o-- \"0..*\" Order\
          \ : places\nOrder \"1\" o-- \"0..*\" OrderItem : contains\nOrderItem \"\
          1\" --> \"1\" Product : refers\nOrder \"1\" o-- \"0..1\" Invoice : billed_by\n\
          Invoice \"1\" o-- \"0..*\" Payment : records\n\n@enduml\n\n\n\n**File: `behavioral.puml`**\n\
          \n@startuml behavioral\n|Customer|\nstart\n:Browse Products;\npartition\
          \ SubmitOrder {\n    :Create Order;\n    if (Customer known?) then (yes)\n\
          \        if (At least one OrderItem?) then (yes)\n            if (All Products\
          \ exist?) then (yes)\n                :Compute total;\n                :Set\
          \ status to submitted;\n                :Store Order;\n                note\
          \ right: Order [submitted]\n            else (no)\n                :Reject\
          \ - unknown product;\n                stop\n            endif\n        else\
          \ (no)\n            :Reject - no items;\n            stop\n        endif\n\
          \    else (no)\n        :Reject - unknown customer;\n        stop\n    endif\n\
          }\n|OrderStaff|\npartition ReceiveOrder {\n    if (Order status == submitted)\
          \ then (yes)\n        :Set status to pending;\n        note right: Order\
          \ [pending]\n    else (no)\n        :Reject receive;\n    endif\n}\npartition\
          \ FillOrder {\n    if (Order status == pending) then (yes)\n        :Set\
          \ status to filled;\n        note right: Order [filled]\n    else (no)\n\
          \        :Reject fill;\n    endif\n}\npartition ShipOrder {\n    if (Order\
          \ status == filled) then (yes)\n        :Set status to shipped;\n      \
          \  note right: Order [shipped]\n    else (no)\n        :Reject ship;\n \
          \   endif\n}\n|Accountant|\npartition Invoice {\n    if (Order status in\
          \ (filled, shipped) && !Order.Invoice) then (yes)\n        :Create Invoice\
          \ (status issued);\n        note right: Invoice [issued]\n    else (no)\n\
          \        :Reject invoice creation;\n    endif\n}\npartition Payment {\n\
          \    if (Invoice status == issued) then (yes)\n        :Create Payment (status\
          \ pending);\n        note right: Payment [pending]\n    else (no)\n    \
          \    :Reject payment;\n    endif\n}\npartition ConfirmPayment {\n    if\
          \ (Payment status == pending) then (yes)\n        :Set Payment status to\
          \ completed;\n        :Set Invoice status to paid;\n        note right:\
          \ Payment [completed]\\nInvoice [paid]\n    else (no)\n        :Reject confirm;\n\
          \    endif\n}\npartition RejectPayment {\n    if (Payment status == pending)\
          \ then (yes)\n        :Set Payment status to failed;\n        note right:\
          \ Payment [failed]\n    else (no)\n        :Reject reject;\n    endif\n\
          }\n|OrderStaff|\npartition CloseOrder {\n    if (Order status == shipped\
          \ && Invoice status == paid) then (yes)\n        :Set Order status to closed;\n\
          \        note right: Order [closed]\n    else (no)\n        :Reject close;\n\
          \    endif\n}\nstop\n@enduml\n\n\n\n**File: `requirements.json`**\n\n{\n\

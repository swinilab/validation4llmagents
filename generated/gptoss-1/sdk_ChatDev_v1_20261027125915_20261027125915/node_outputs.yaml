          \ <br> **US-50-AC03** (given_when_then): Given a Customer creation payload\
          \ missing any other mandatory attribute, When the endpoint is called, Then\
          \ error 400 is returned. |\n\n## 3.2 Quality attributes\n### 3.2.1 Performance\n\
          * **NFR-01** – When a user submits an order containing up to 50 order items\
          \ under normal operating conditions, the system shall register the order\
          \ and respond within 2 seconds for at least 95 % of submissions.  \n* **NFR-02**\
          \ – Under normal operating conditions, the system shall support at least\
          \ 200 concurrent users and at least 20 order submissions per second while\
          \ meeting the response time of NFR‑01.  \n\n### 3.2.2 Security\n* **NFR-03**\
          \ – The system shall authenticate every user before granting access to any\
          \ customer, order, invoice or payment data, and shall reject 100 % of unauthenticated\
          \ requests.  \n* **NFR-04** – The system shall allow only users holding\
          \ the accountant role to confirm or reject a payment, and shall reject the\
          \ same request from any other user.  \n* **NFR-05** – The system shall protect\
          \ customer personal data and bank account numbers by encrypting them in\
          \ transit with TLS 1.2 or higher and at rest.  \n\n### 3.2.3 Availability\n\
          * **NFR-06** – The system shall be available for at least 99.5 % of each\
          \ calendar month, excluding scheduled maintenance announced at least 24 hours\
          \ in advance.  \n* **NFR-07** – When a server failure occurs, the system\
          \ shall resume accepting requests within 15 minutes without losing any order,\
          \ invoice or payment recorded before the failure.  \n* **NFR-08** – The\
          \ system shall record the user and the time of every status change of an\
          \ order, an invoice and a payment, and shall retain these records for at\
          \ least 12 months.  \n\n# 4. Verification\nEach functional requirement will\
          \ be verified by unit, integration and end‑to‑end tests derived from its\
          \ acceptance criteria. Non‑functional requirements will be verified by performance\
          \ testing (Locust), security testing (penetration tests) and availability\
          \ monitoring (SLA dashboards).\n\n# 5. Supporting information\n* Structural\
          \ diagram – **structural.puml**  \n* Behavioral diagram – **behavioral.puml**\
          \  \n* Machine‑readable requirement list – **requirements.json**  \n* Traceability\
          \ matrix – **VMX.csv**  \n\n\n\n**structural.puml**\n@startuml structural\n\
          ' Enumerations\nenum OrderStatus {\n  submitted\n  pending\n  filled\n \
          \ shipped\n  closed\n}\nenum InvoiceStatus {\n  issued\n  paid\n}\nenum\
          \ PaymentStatus {\n  pending\n  completed\n  failed\n}\nenum PaymentMethod\
          \ {\n  bank\n  card\n  cash\n}\n\n' Classes\nclass Customer {\n  +id: UUID\n\
          \  +name: String\n  +address: String\n  +phone: String\n}\nclass BankAccount\
          \ {\n  +accountNumber: String\n  +bankName: String\n}\nclass Product {\n\
          \  +id: UUID\n  +name: String\n  +description: String\n  +price: Decimal\n\
          \  +imageUrl: String\n}\nclass Order {\n  +id: UUID\n  +orderDate: DateTime\n\
          \  +totalAmount: Decimal\n  +status: OrderStatus\n  +paymentMethod: PaymentMethod\n\
          }\nclass OrderItem {\n  +id: UUID\n  +quantity: Integer\n  +unitPrice: Decimal\n\
          }\nclass Invoice {\n  +id: UUID\n  +date: DateTime\n  +amount: Decimal\n\
          \  +status: InvoiceStatus\n  +paymentMethod: PaymentMethod\n}\nclass Payment\
          \ {\n  +id: UUID\n  +date: DateTime\n  +amount: Decimal\n  +status: PaymentStatus\n\
          \  +paymentMethod: PaymentMethod\n}\nclass AuditLog {\n  +id: UUID\n  +entity:\
          \ String\n  +entityId: UUID\n  +action: String\n  +performedBy: String\n\
          \  +timestamp: DateTime\n}\n\n' Relationships\nCustomer \"1\" o-- \"0..1\"\
          \ BankAccount : has\nCustomer \"1\" o-- \"0..*\" Order : places\nOrder \"\
          1\" o-- \"0..1\" Invoice : generates\nInvoice \"1\" o-- \"0..*\" Payment\
          \ : records\nOrder \"1\" *-- \"0..*\" OrderItem : contains\nOrderItem \"\
          1\" --> \"1\" Product : refers to\n\n@enduml\n\n\n\n**behavioral.puml**\n\
          @startuml behavioral\n|Customer|\nstart\n:Submit Order;\nif (Customer exists?)\
          \ then (yes)\n  if (At least one item?) then (yes)\n    if (All products\
          \ exist?) then (yes)\n      :Create Order [submitted];\n      note right:\
          \ total calculated (US‑17)\n    else (no)\n      :Reject Order (REQ‑F‑16);\n\
          \      stop\n    endif\n  else (no)\n    :Reject Order (REQ‑F‑15);\n   \
          \ stop\n  endif\nelse (no)\n  :Reject Order (REQ‑F‑14);\n  stop\nendif\n\
          partition OrderStaff {\n  :Receive Order;\n  if (status = submitted) then\
          \ (yes)\n    :Set status to pending (US‑18);\n  else (no)\n    :Reject receive\
          \ (US‑19);\n  endif\n  :Mark as Filled;\n  if (status = pending) then (yes)\n\
          \    :Set status to filled (US‑20);\n  else (no)\n    :Reject fill (US‑21);\n\
          \  endif\n  :Ship Order;\n  if (status = filled) then (yes)\n    :Set status\
          \ to shipped (US‑25);\n  else (no)\n    :Reject ship (US‑26);\n  endif\n\
          \  :Close Order;\n  if (status = shipped && Invoice.status = paid) then\
          \ (yes)\n    :Set status to closed (US‑40);\n  else (no)\n    :Reject close\
          \ (US‑41/42);\n  endif\n}\npartition Accountant {\n  :Raise Invoice;\n \
          \ if (Order.status in {filled,shipped} && no Invoice) then (yes)\n    :Create\
          \ Invoice [issued] (US‑28);\n  else (no)\n    :Reject invoice (US‑30/24);\n\
          \  endif\n  :Confirm Payment;\n  if (Payment.status = pending) then (yes)\n\
          \    :Set Payment status to completed (US‑35);\n    :Set Invoice status\
          \ to paid (US‑36);\n  else (no)\n    :Reject confirm (US‑39);\n  endif\n\
          \  :Reject Payment;\n  if (Payment.status = pending) then (yes)\n    :Set\
          \ Payment status to failed (US‑38);\n  else (no)\n    :Reject reject (US‑39);\n\
          \  endif\n}\nstop\n@enduml\n\n\n\n**requirements.json**\n{\n  \"version\"\

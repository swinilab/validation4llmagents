      - type: text
        text: "**srs.md**\n# 1. Introduction\n## 1.1 Purpose\nThe purpose of this\
          \ Software Requirements Specification (SRS) is to define the functional\
          \ and non‑functional requirements for the Order Management System (OMS).\
          \ The SRS is intended for developers, testers, and stakeholders.\n\n## 1.2\
          \ Scope\nThe OMS supports customers, order staff, and accountants in managing\
          \ customers, products, orders, invoices, and payments. All business rules\
          \ described in the domain requirements are captured as user stories with\
          \ acceptance criteria.\n\n## 1.3 Definitions and acronyms\n* **OMS** – Order\
          \ Management System  \n* **API** – Application Programming Interface  \n\
          * **DTO** – Data Transfer Object  \n* **TLS** – Transport Layer Security\
          \  \n\n# 2. Overall description\n## 2.1 Product perspective\nThe OMS is\
          \ a stand‑alone web service exposing a RESTful API. It stores data in a\
          \ relational database and enforces business rules through the service layer.\n\
          \n## 2.2 Product functions\n* Manage customers and optional bank accounts.\
          \  \n* Manage product catalog.  \n* Create, validate, and process orders.\
          \  \n* Generate invoices and record payments.  \n* Enforce role‑based access\
          \ control.\n\n## 2.3 User characteristics\n* **Customer** – end‑user, interacts\
          \ with order‑related endpoints.  \n* **OrderStaff** – internal staff, interacts\
          \ with order‑processing endpoints.  \n* **Accountant** – internal staff,\
          \ interacts with invoicing and payment endpoints.\n\n## 2.4 Assumptions\
          \ and dependencies\n* A PostgreSQL database is available.  \n* TLS 1.2+\
          \ is configured for all network traffic.  \n* All monetary values are stored\
          \ as decimal types.\n\n# 3. Requirements\n## 3.1 Functional requirements\n\
          \n| ID | User story | Acceptance criteria |\n|----|------------|----------------------|\n\
          | **US-01** | As a **Customer**, I want to store my name, address and phone\
          \ number, so that the system can identify me for order processing. | **US-01-AC01**\
          \ (condition): Customer.name, Customer.address and Customer.phone are mandatory\
          \ strings. <br> **US-01-AC02** (condition): The system rejects creation\
          \ of a Customer record when any mandatory attribute is missing. <br> **US-01-AC03**\
          \ (given_when_then): Given a valid Customer payload, When the API receives\
          \ `POST /customers`, Then a new Customer record is persisted and returns\
          \ status 201. |\n| **US-02** | As a **Customer**, I want to optionally add\
          \ a single bank account, so that I can pay by bank when needed. | **US-02-AC01**\
          \ (condition): Each Customer may have zero or one BankAccount. <br> **US-02-AC02**\
          \ (given_when_then): Given an existing Customer, When `POST /customers/{id}/bank-account`\
          \ is called with valid bank data, Then the BankAccount is linked to the\
          \ Customer. <br> **US-02-AC03** (condition): The system rejects a second\
          \ bank‑account addition for the same Customer. |\n| **US-03** | As a **Customer**,\
          \ I want to view products that have a name, description, price and image,\
          \ so that I can decide what to buy. | **US-03-AC01** (condition): Product.name,\
          \ description, price, and image are mandatory; price is a decimal. <br>\
          \ **US-03-AC02** (given_when_then): Given existing Products, When `GET /products`\
          \ is called, Then the response contains all mandatory attributes for each\
          \ product. <br> **US-03-AC03** (condition): The system rejects creation\
          \ of a Product when any mandatory attribute is missing. |\n| **US-04** |\
          \ As a **Customer**, I want products to exist independently of order items,\
          \ so that I can browse them even if no order references them. | **US-04-AC01**\
          \ (condition): Deleting an OrderItem does not delete the referenced Product.\
          \ <br> **US-04-AC02** (condition): A Product may have zero or many OrderItems.\
          \ <br> **US-04-AC03** (given_when_then): Given a Product with no OrderItems,\
          \ When `DELETE /products/{id}` is called, Then the Product is removed without\
          \ affecting any OrderItem (none exist). |\n| **US-05** | As a **Customer**,\
          \ I want each order to record a date, total amount, status and payment method,\
          \ so that I can track my purchases. | **US-05-AC01** (condition): Order.date,\
          \ total, status, paymentMethod are mandatory; status ∈ {submitted,pending,filled,shipped,closed}.\
          \ <br> **US-05-AC02** (condition): paymentMethod ∈ {bank,card,cash}. <br>\
          \ **US-05-AC03** (given_when_then): Given a successful order submission,\
          \ When the order is stored, Then Order.total equals the sum of its OrderItems\
          \ (see US‑17). |\n| **US-06** | As a **Customer**, I want each order item\
          \ to store quantity, unit price and a reference to exactly one product,\
          \ so that the order total can be calculated. | **US-06-AC01** (condition):\
          \ OrderItem.quantity and unitPrice are mandatory; unitPrice is decimal.\
          \ <br> **US-06-AC02** (condition): OrderItem must reference exactly one\
          \ existing Product. <br> **US-06-AC03** (given_when_then): Given an Order\
          \ with items, When the order is persisted, Then each OrderItem is linked\
          \ to its Product and stored. |\n| **US-07** | As a **Customer**, I want\
          \ order items to exist only as part of their order, so that they cannot\
          \ be moved or left orphaned. | **US-07-AC01** (condition): OrderItem is\
          \ a composition of Order (lifespan bound). <br> **US-07-AC02** (given_when_then):\
          \ Given an Order, When the Order is deleted, Then all its OrderItems are\
          \ also deleted. <br> **US-07-AC03** (condition): The system rejects attempts\
          \ to reassign an OrderItem to a different Order. |\n| **US-08** | As a **Customer**,\
          \ I want each order to be linked to exactly one customer, while a customer\
          \ may have many orders, so that I can view my order history. | **US-08-AC01**\
          \ (condition): Order.customer is mandatory; multiplicity 1..* from Customer\
          \ to Order. <br> **US-08-AC02** (given_when_then): Given a Customer, When\
          \ `GET /customers/{id}/orders` is called, Then all orders belonging to that\
          \ Customer are returned. <br> **US-08-AC03** (condition): The system rejects\
          \ creation of an Order without a valid Customer reference. |\n| **US-09**\
          \ | As an **Accountant**, I want each invoice to record a date, amount,\
          \ status and payment method, so that billing can be tracked. | **US-09-AC01**\
          \ (condition): Invoice.date, amount, status, paymentMethod are mandatory;\
          \ status ∈ {issued,paid}. <br> **US-09-AC02** (condition): paymentMethod\
          \ ∈ {bank,card,cash}. <br> **US-09-AC03** (given_when_then): Given a filled\
          \ order, When the accountant creates an invoice, Then the invoice is stored\
          \ with status issued. |\n| **US-10** | As an **Accountant**, I want at most\
          \ one invoice per order, so that billing is unambiguous. | **US-10-AC01**\
          \ (condition): Order ↔ Invoice is a 1‑to‑0..1 relationship. <br> **US-10-AC02**\
          \ (given_when_then): Given an order that already has an invoice, When the\
          \ accountant attempts to create another invoice, Then the system returns\
          \ an error. <br> **US-10-AC03** (condition): The system rejects invoice\
          \ creation for orders without the required status (see US‑28). |\n| **US-11**\
          \ | As an **Accountant**, I want each payment to record a date, amount,\
          \ status and payment method, so that receipt of funds is documented. | **US-11-AC01**\
          \ (condition): Payment.date, amount, status, paymentMethod are mandatory;\
          \ status ∈ {pending,completed,failed}. <br> **US-11-AC02** (condition):\
          \ paymentMethod ∈ {bank,card,cash}. <br> **US-11-AC03** (given_when_then):\
          \ Given an invoice, When a payment is posted, Then a Payment record with\
          \ status pending is created. |\n| **US-12** | As an **Accountant**, I want\
          \ an invoice to accept any number of payments, so that partial payments\
          \ can be recorded. | **US-12-AC01** (condition): Invoice ↔ Payment is 1‑to‑0..*\
          \ . <br> **US-12-AC02** (given_when_then): Given an invoice, When multiple\
          \ payments are posted, Then each payment is linked to that invoice. <br>\
          \ **US-12-AC03** (condition): A payment always references exactly one invoice,\
          \ never an order directly. |\n| **US-13** | As a **Customer**, I want to\
          \ submit an order that names a known customer, contains at least one order\
          \ item referencing existing products, and carries a payment method, so that\
          \ my purchase is recorded. | **US-13-AC01** (given_when_then): Given a known\
          \ Customer and existing Products, When `POST /orders` with valid items and\
          \ paymentMethod is called, Then an Order is created with status submitted\
          \ and orderDate = submission date. <br> **US-13-AC02** (condition): The\
          \ order must contain ≥ 1 OrderItem. <br> **US-13-AC03** (condition): All\
          \ referenced Products must exist. |\n| **US-14** | As a **Customer**, I\
          \ want the system to reject an order submission if the customer is unknown,\
          \ so that only registered customers can order. | **US-14-AC01** (given_when_then):\
          \ Given a non‑existent Customer ID, When `POST /orders` is called, Then\
          \ the system returns error 404 and no Order is created. |\n| **US-15** |\
          \ As a **Customer**, I want the system to reject an order that contains\
          \ no order items, so that empty orders cannot be created. | **US-15-AC01**\
          \ (given_when_then): Given a request with an empty items array, When `POST\
          \ /orders` is called, Then the system returns error 400 and no Order is\
          \ created. |\n| **US-16** | As a **Customer**, I want the system to reject\
          \ an order if any order item refers to a non‑existent product, so that orders\
          \ are always valid. | **US-16-AC01** (given_when_then): Given an order payload\
          \ containing a productId that does not exist, When `POST /orders` is called,\
          \ Then the system returns error 400 and no Order is created. |\n| **US-17**\
          \ | As a **Customer**, I want the system to calculate the order total as\
          \ Σ(quantity × unitPrice) of its items, so that I see the correct amount\
          \ due. | **US-17-AC01** (condition): Order.total = Σ(OrderItem.quantity × OrderItem.unitPrice).\
          \ <br> **US-17-AC02** (given_when_then): Given a valid order submission,\
          \ When the order is persisted, Then Order.total reflects the calculated\
          \ sum. <br> **US-17-AC03** (condition): Changing an OrderItem after submission\
          \ is prohibited (see US‑07). |\n| **US-18** | As **OrderStaff**, I want\
          \ to receive a submitted order, changing its status to pending, so that\
          \ I can start processing it. | **US-18-AC01** (given_when_then): Given an\
          \ Order with status submitted, When `PATCH /orders/{id}/receive` is called,\
          \ Then Order.status becomes pending. <br> **US-18-AC02** (condition): Only\
          \ orders in submitted status can be received. <br> **US-18-AC03** (given_when_then):\
          \ Given an order not in submitted status, When receive is attempted, Then\
          \ the system returns error 409 and status is unchanged. |\n| **US-19** |\
          \ As **OrderStaff**, I want the system to reject receiving an order whose\
          \ status is not submitted, so that status flow is enforced. | **US-19-AC01**\
          \ (given_when_then): Given an Order with status pending, When `PATCH /orders/{id}/receive`\
          \ is called, Then error 409 is returned and status remains pending. |\n\
          | **US-20** | As **OrderStaff**, I want to mark a pending order as filled,\
          \ so that it proceeds to the next stage. | **US-20-AC01** (given_when_then):\
          \ Given an Order with status pending, When `PATCH /orders/{id}/fill` is\
          \ called, Then status becomes filled. <br> **US-20-AC02** (condition): Only\
          \ pending orders can be filled. |\n| **US-21** | As **OrderStaff**, I want\
          \ the system to reject filling an order whose status is not pending, so\
          \ that the workflow is respected. | **US-21-AC01** (given_when_then): Given\
          \ an Order with status submitted, When `PATCH /orders/{id}/fill` is called,\
          \ Then error 409 is returned and status unchanged. |\n| **US-22** | As **OrderStaff**,\
          \ I want to decline a pending order, changing its status to closed, so that\
          \ it is terminated. | **US-22-AC01** (given_when_then): Given an Order with\
          \ status pending, When `PATCH /orders/{id}/decline` is called, Then status\
          \ becomes closed. |\n| **US-23** | As **OrderStaff**, I want the system\
          \ to reject declining an order whose status is not pending, so that only\
          \ pending orders can be closed early. | **US-23-AC01** (given_when_then):\
          \ Given an Order with status filled, When `PATCH /orders/{id}/decline` is\
          \ called, Then error 409 is returned. |\n| **US-24** | As **OrderStaff**,\
          \ I want the system to reject raising an invoice for a declined order, so\
          \ that no billing occurs for cancelled orders. | **US-24-AC01** (given_when_then):\
          \ Given an Order with status closed (declined), When `POST /orders/{id}/invoice`\
          \ is called, Then error 400 is returned. |\n| **US-25** | As **OrderStaff**,\
          \ I want to set an order status to shipped when it is filled, so that the\
          \ customer can receive the goods. | **US-25-AC01** (given_when_then): Given\
          \ an Order with status filled, When `PATCH /orders/{id}/ship` is called,\
          \ Then status becomes shipped. |\n| **US-26** | As **OrderStaff**, I want\
          \ the system to reject shipping an order whose status is not filled, so\
          \ that shipping follows fulfillment. | **US-26-AC01** (given_when_then):\
          \ Given an Order with status pending, When `PATCH /orders/{id}/ship` is\
          \ called, Then error 409 is returned. |\n| **US-27** | As **OrderStaff**,\
          \ I want the system to leave invoice and payment statuses unchanged when\
          \ an order is shipped, so that billing is independent of shipping. | **US-27-AC01**\
          \ (given_when_then): Given an Order with an associated Invoice and Payments,\
          \ When the order is shipped, Then Invoice.status and each Payment.status\
          \ remain unchanged. |\n| **US-28** | As an **Accountant**, I want to raise\
          \ an invoice for a filled or shipped order that has no invoice, so that\
          \ the customer receives a bill. | **US-28-AC01** (given_when_then): Given\
          \ an Order with status filled or shipped and no Invoice, When `POST /orders/{id}/invoice`\
          \ is called with required fields, Then an Invoice with status issued is\
          \ created. |\n| **US-29** | As an **Accountant**, I want the system to reject\
          \ creating a second invoice for an order that already has one, so that duplicate\
          \ billing is prevented. | **US-29-AC01** (given_when_then): Given an Order\
          \ with an existing Invoice, When `POST /orders/{id}/invoice` is called,\
          \ Then error 409 is returned. |\n| **US-30** | As an **Accountant**, I want\
          \ the system to reject invoicing orders whose status is submitted, pending\
          \ or closed, so that invoices are only issued after fulfillment. | **US-30-AC01**\
          \ (given_when_then): Given an Order with status submitted, When invoice\
          \ creation is attempted, Then error 400 is returned. (Same for pending and\
          \ closed.) |\n| **US-31** | As an **Accountant**, I want invoicing and shipping\
          \ to proceed independently once an order is filled, so that either can occur\
          \ first or simultaneously. | **US-31-AC01** (condition): No status dependency\
          \ exists between Invoice.status and Order.status shipped. <br> **US-31-AC02**\
          \ (given_when_then): Given a filled order, When both `POST /orders/{id}/invoice`\
          \ and `PATCH /orders/{id}/ship` are invoked concurrently, Then both succeed\
          \ independently. |\n| **US-32** | As a **Customer**, I want to submit a\
          \ payment against an issued invoice, so that I can settle my bill. | **US-32-AC01**\
          \ (given_when_then): Given an Invoice with status issued, When `POST /invoices/{id}/payments`\
          \ is called, Then a Payment with status pending is created. |\n| **US-33**\
          \ | As a **Customer**, I want the system to reject a payment against a paid\
          \ invoice, so that over‑payment is prevented. | **US-33-AC01** (given_when_then):\
          \ Given an Invoice with status paid, When a payment is posted, Then error 400\
          \ is returned. |\n| **US-34** | As a **Customer**, I want to submit a further\
          \ payment if a previous payment failed, so that I can retry the transaction.\
          \ | **US-34-AC01** (given_when_then): Given an Invoice with a Payment in\
          \ status failed, When a new payment is posted, Then a new Payment with status pending\
          \ is created while the failed one remains failed. |\n| **US-35** | As an\
          \ **Accountant**, I want to confirm a pending payment, changing its status\
          \ to completed, so that the payment is recorded as successful. | **US-35-AC01**\
          \ (given_when_then): Given a Payment with status pending, When `PATCH /payments/{id}/confirm`\
          \ is called, Then status becomes completed. |\n| **US-36** | As an **Accountant**,\
          \ I want confirming a pending payment to set the related invoice status\

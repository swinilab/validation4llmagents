            type: function
            function:
              name: save_file
              arguments: '{"content":"# Software Requirements Specification (SRS)\n\n##
                1. Introduction\n### 1.1 Purpose\nThis document defines the functional
                and non‑functional requirements for the Order Management System (OMS).
                It is intended for developers, testers, project managers, and stakeholders.\n\n###
                1.2 Scope\nThe OMS supports customers placing orders, staff processing
                orders, and accountants handling invoicing and payments. It covers
                data management, order lifecycle, invoicing, payment processing, and
                related security and availability constraints.\n\n### 1.3 Definitions
                and acronyms\n- **Customer** – end‑user who browses products and submits
                orders.\n- **OrderStaff** – internal employee who receives, validates
                and fulfills orders.\n- **Accountant** – internal employee who creates
                invoices and records payments.\n- **OMS** – Order Management System.\n-
                **DTO** – Data Transfer Object.\n- **TLS** – Transport Layer Security.\n\n##
                2. Overall description\n### 2.1 Product perspective\nThe OMS is a
                standalone web‑based application that persists its data in a relational
                database. It interacts with external payment gateways via secure APIs.\n\n###
                2.2 Product functions\n- Manage customers, products, orders, invoices
                and payments.\n- Enforce business rules for order lifecycle and invoicing.\n-
                Provide role‑based access control.\n\n### 2.3 User characteristics\n-
                **Customer** – basic web user, able to browse and place orders.\n-
                **OrderStaff** – staff member with permissions to modify order status.\n-
                **Accountant** – staff member with permissions to create invoices
                and process payments.\n\n### 2.4 Assumptions and dependencies\n- The
                system runs on a modern server stack supporting Python 3.11.\n- TLS 1.2+
                is available for encrypted communication.\n- A relational database
                (e.g., PostgreSQL) is provisioned.\n\n## 3. Requirements\n### 3.1
                Functional requirements\n| ID | User story |\n|----|------------|\n|
                **US-01** | As a **Customer**, I want my personal details (name, address,
                phone) stored, so that the system can uniquely identify me. |\n| **US-02**
                | As a **Customer**, I want to optionally add a single bank account,
                so that I can use it for payments. |\n| **US-03** | As an **OrderStaff**,
                I want to maintain product information (name, description, price,
                image), so that customers can view accurate product data. |\n| **US-04**
                | As a **Customer**, I want to submit an order that references existing
                products, includes at least one order item, and specifies a payment
                method, so that I can purchase items. |\n| **US-05** | As an **OrderStaff**,
                I want to change an order’s status according to the allowed workflow,
                so that the order proceeds through the correct lifecycle. |\n| **US-06**
                | As an **Accountant**, I want to raise a single invoice for a filled
                or shipped order, so that the customer can be billed. |\n| **US-07**
                | As a **Customer**, I want to submit a payment against an issued
                invoice, so that I can settle my bill. |\n| **US-08** | As an **Accountant**,
                I want to confirm or reject a pending payment, so that the invoice
                status reflects the payment outcome. |\n| **US-09** | As an **OrderStaff**,
                I want to close a shipped order whose invoice is paid, so that the
                order lifecycle ends. |\n| **US-10** | As the **system**, I want to
                enforce data‑integrity rules (mandatory attributes, multiplicities,
                decimal types, enumerated values), so that the data remains consistent.\n\n####
                Acceptance criteria\n\n**US-01 – As a Customer, I want my personal
                details stored**\n- **US-01-AC01** (condition): Customer name, address
                and phone number are mandatory and stored as non‑empty strings.\n-
                **US-01-AC02** (condition): The system rejects creation of a customer
                record when any mandatory attribute is missing.\n- **US-01-AC03**
                (given_when_then): Given a valid customer input, When the customer
                is created, Then the record persists with the provided attributes.\n\n**US-02
                – As a Customer, I want to optionally add a single bank account**\n-
                **US-02-AC01** (condition): A customer may have zero or one bank account;
                attempts to add a second bank account are rejected.\n- **US-02-AC02**
                (condition): Bank account data is stored encrypted at rest and in
                transit.\n- **US-02-AC03** (given_when_then): Given a customer without
                a bank account, When the customer adds a bank account, Then the account
                is linked to the customer.\n\n**US-03 – As an OrderStaff, I want to
                maintain product information**\n- **US-03-AC01** (condition): Product
                name, description, price and image are mandatory; price is a decimal
                number.\n- **US-03-AC02** (condition): The system rejects creation
                of a product when any mandatory attribute is missing.\n- **US-03-AC03**
                (given_when_then): Given valid product data, When the product is saved,
                Then it is persisted and can be referenced by order items.\n\n**US-04
                – As a Customer, I want to submit an order**\n- **US-04-AC01** (given_when_then):
                Given a known customer, at least one order item referencing existing
                products, and a valid payment method, When the order is submitted,
                Then the system creates an order with status *submitted*, order date
                set to the submission time, and total amount calculated as Σ(quantity × unit
                price).\n- **US-04-AC02** (given_when_then): Given an unknown customer,
                When the order is submitted, Then the system rejects the submission
                and no order is created.\n- **US-04-AC03** (given_when_then): Given
                an order with zero items, When the order is submitted, Then the system
                rejects the submission and no order is created.\n- **US-04-AC04**
                (given_when_then): Given an order item referencing a non‑existent
                product, When the order is submitted, Then the system rejects the
                submission and no order is created.\n- **US-04-AC05** (condition):
                Payment method on the order is restricted to the values *bank*, *card*,
                or *cash*.\n\n**US-05 – As an OrderStaff, I want to change an order’s
                status**\n- **US-05-AC01** (given_when_then): Given an order with
                status *submitted*, When the staff receives the order, Then the status
                changes to *pending*.\n- **US-05-AC02** (given_when_then): Given an
                order with status *submitted*, When the staff attempts to receive
                it, Then the system rejects the request and the status remains *submitted*.\n-
                **US-05-AC03** (given_when_then): Given an order with status *pending*,
                When the staff marks it as *filled*, Then the status changes to *filled*.\n-
                **US-05-AC04** (given_when_then): Given an order with status *pending*,
                When the staff attempts to mark it as *filled*, Then the system rejects
                the request and the status remains *pending*.\n- **US-05-AC05** (given_when_then):
                Given an order with status *pending*, When the staff declines the
                order, Then the status changes to *closed*.\n- **US-05-AC06** (given_when_then):
                Given an order with status *filled*, When the staff ships the order,
                Then the status changes to *shipped*.\n- **US-05-AC07** (given_when_then):
                Given an order with status *shipped*, When the staff attempts to close
                the order but the invoice is not *paid*, Then the system rejects the
                request and the status remains *shipped*.\n- **US-05-AC08** (condition):
                Order status may only transition as follows: submitted → pending →
                filled → shipped → closed; or submitted → pending → closed.\n\n**US-06
                – As an Accountant, I want to raise a single invoice**\n- **US-06-AC01**
                (given_when_then): Given a filled or shipped order without an existing
                invoice, When the accountant raises an invoice, Then an invoice is
                created with status *issued*, the supplied date, amount, and payment
                method.\n- **US-06-AC02** (given_when_then): Given an order that already
                has an invoice, When the accountant attempts to raise another invoice,
                Then the system rejects the request.\n- **US-06-AC03** (given_when_then):
                Given an order with status *submitted*, *pending* or *closed*, When
                the accountant attempts to raise an invoice, Then the system rejects
                the request.\n- **US-06-AC04** (condition): Payment method on an invoice
                is limited to *bank*, *card*, or *cash*.\n\n**US-07 – As a Customer,
                I want to submit a payment**\n- **US-07-AC01** (given_when_then):
                Given an invoice with status *issued*, When the customer submits a
                payment with a valid payment method, Then a payment record is created
                with status *pending*.\n- **US-07-AC02** (given_when_then): Given
                an invoice with status *paid*, When the customer attempts to submit
                a payment, Then the system rejects the request.\n- **US-07-AC03**
                (given_when_then): Given an invoice whose previous payment has status
                *failed*, When the customer submits a new payment, Then the new payment
                is created with status *pending* and the failed payment remains *failed*.\n\n**US-08
                – As an Accountant, I want to confirm or reject a pending payment**\n-
                **US-08-AC01** (given_when_then): Given a payment with status *pending*,
                When the accountant confirms it, Then the payment status becomes *completed*
                and the related invoice status changes to *paid*.\n- **US-08-AC02**
                (given_when_then): Given a payment with status *pending*, When the
                accountant rejects it, Then the payment status becomes *failed* and
                the invoice and order statuses remain unchanged.\n- **US-08-AC03**
                (given_when_then): Given a payment whose status is not *pending*,
                When the accountant attempts to confirm or reject it, Then the system
                rejects the request and the status remains unchanged.\n\n**US-09 –
                As an OrderStaff, I want to close a shipped order whose invoice is
                paid**\n- **US-09-AC01** (given_when_then): Given a shipped order
                whose associated invoice has status *paid*, When the staff closes
                the order, Then the order status becomes *closed*.\n- **US-09-AC02**
                (given_when_then): Given a shipped order whose invoice is not *paid*,
                When the staff attempts to close the order, Then the system rejects
                the request and the order status remains *shipped*.\n- **US-09-AC03**
                (condition): Once an order reaches status *closed*, no further status
                changes are allowed.\n\n**US-10 – As the system, I want to enforce
                data‑integrity rules**\n- **US-10-AC01** (condition): All monetary
                values (product price, unit price, order total, invoice amount, payment
                amount) are stored as decimal numbers.\n- **US-10-AC02** (condition):
                Order status is restricted to the enum values *submitted*, *pending*,
                *filled*, *shipped*, *closed*.\n- **US-10-AC03** (condition): Invoice
                status is restricted to *issued* or *paid*.\n- **US-10-AC04** (condition):
                Payment status is restricted to *pending*, *completed*, or *failed*.\n-
                **US-10-AC05** (condition): Payment method on orders, invoices and
                payments is limited to *bank*, *card*, or *cash*.\n\n### 3.2 Quality
                attributes\n#### 3.2.1 Performance\n- **NFR-01**: When a user submits
                an order containing up to 50 order items under normal operating conditions,
                the system shall register the order and respond within 2 seconds for
                at least 95% of submissions.\n- **NFR-02**: Under normal operating
                conditions, the system shall support at least 200 concurrent users
                and at least 20 order submissions per second while meeting the response
                time of NFR‑01.\n\n#### 3.2.2 Security\n- **NFR-03**: The system shall
                authenticate every user before granting access to any customer, order,
                invoice or payment data, and shall reject 100% of unauthenticated
                requests.\n- **NFR-04**: The system shall allow only users holding
                the accountant role to confirm or reject a payment, and shall reject
                the same request from any other user.\n- **NFR-05**: The system shall
                protect customer personal data and bank account numbers by encrypting
                them in transit with TLS 1.2 or higher and at rest.\n- **NFR-06**:
                The system shall record the user and the time of every status change
                of an order, an invoice and a payment, and shall retain these records
                for at least 12 months.\n\n#### 3.2.3 Availability\n- **NFR-07**:
                The system shall be available for at least 99.5% of each calendar
                month, excluding scheduled maintenance announced at least 24 hours
                in advance.\n- **NFR-08**: When a server failure occurs, the system
                shall resume accepting requests within 15 minutes without losing any
                order, invoice or payment recorded before the failure.\n\n## 4. Verification\nVerification
                methods include unit tests, integration tests, performance load testing,
                security penetration testing, and automated compliance audits against
                the acceptance criteria defined above.\n\n## 5. Supporting information\n-
                Structural diagram: `structural.puml`\n- Behavioral diagram: `behavioral.puml`\n-
                Requirements listing: `requirements.json`\n- Traceability matrix:
                `VMX.csv`\n","encoding":"utf-8","mode":"auto","path":"srs.md"}'

                **US-08-AC01** (given_when_then): Given a payment with status *pending*,
                When the accountant confirms it, Then the payment status becomes *completed*
                and the related invoice status changes to *paid*.\n- **US-08-AC02**
                (given_when_then): Given a payment with status *pending*, When the
                accountant rejects it, Then the payment status becomes *failed* and
                the invoice and order statuses remain unchanged.\n- **US-08-AC03**
                (given_when_then): Given a payment whose status is not *pending*,
                When the accountant attempts to confirm or reject it, Then the system
                rejects the request and the status remains unchanged.\n\n**US-09 –
                As an OrderStaff, I want to close a shipped order whose invoice is
                paid**\n- **US-09-AC01** (given_when_then): Given a shipped order
                whose associated invoice has status *paid*, When the staff closes
                the order, Then the order status becomes *closed*.\n- **US-09-AC02**
                (given_when_then): Given a shipped order whose invoice is not *paid*,
                When the staff attempts to close the order, Then the system rejects
                the request and the order status remains *shipped*.\n- **US-09-AC03**
                (condition): Once an order reaches status *closed*, no further status
                changes are allowed.\n\n**US-10 – As the system, I want to enforce
                data‑integrity rules**\n- **US-10-AC01** (condition): All monetary
                values (product price, unit price, order total, invoice amount, payment
                amount) are stored as decimal numbers.\n- **US-10-AC02** (condition):
                Order status is restricted to the enum values *submitted*, *pending*,
                *filled*, *shipped*, *closed*.\n- **US-10-AC03** (condition): Invoice
                status is restricted to *issued* or *paid*.\n- **US-10-AC04** (condition):
                Payment status is restricted to *pending*, *completed*, or *failed*.\n-
                **US-10-AC05** (condition): Payment method on orders, invoices and
                payments is limited to *bank*, *card*, or *cash*.\n\n### 3.2 Quality
                attributes\n#### 3.2.1 Performance\n- **NFR-01**: When a user submits
                an order containing up to 50 order items under normal operating conditions,
                the system shall register the order and respond within 2 seconds for
                at least 95% of submissions.\n- **NFR-02**: Under normal operating
                conditions, the system shall support at least 200 concurrent users
                and at least 20 order submissions per second while meeting the response
                time of NFR‑01.\n\n#### 3.2.2 Security\n- **NFR-03**: The system shall
                authenticate every user before granting access to any customer, order,
                invoice or payment data, and shall reject 100% of unauthenticated
                requests.\n- **NFR-04**: The system shall allow only users holding
                the accountant role to confirm or reject a payment, and shall reject
                the same request from any other user.\n- **NFR-05**: The system shall
                protect customer personal data and bank account numbers by encrypting
                them in transit with TLS 1.2 or higher and at rest.\n- **NFR-06**:
                The system shall record the user and the time of every status change
                of an order, an invoice and a payment, and shall retain these records
                for at least 12 months.\n\n#### 3.2.3 Availability\n- **NFR-07**:
                The system shall be available for at least 99.5% of each calendar
                month, excluding scheduled maintenance announced at least 24 hours
                in advance.\n- **NFR-08**: When a server failure occurs, the system
                shall resume accepting requests within 15 minutes without losing any
                order, invoice or payment recorded before the failure.\n\n## 4. Verification\nVerification
                methods include unit tests, integration tests, performance load testing,
                security penetration testing, and automated compliance audits against
                the acceptance criteria defined above.\n\n## 5. Supporting information\n-
                Structural diagram: `structural.puml`\n- Behavioral diagram: `behavioral.puml`\n-
                Requirements listing: `requirements.json`\n- Traceability matrix:
                `VMX.csv`\n","encoding":"utf-8","mode":"overwrite","path":"srs.md"}'

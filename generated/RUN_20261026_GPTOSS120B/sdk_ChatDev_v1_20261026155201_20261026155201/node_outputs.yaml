              arguments: '{"content":"# 1. Introduction\n## 1.1 Purpose\nThe purpose
                of this Software Requirements Specification (SRS) is to define the
                functional and non‑functional requirements for an **Order Management
                System** (OMS) that supports customers, order staff, and accountants.\n\n##
                1.2 Scope\nThe OMS enables customers to browse products, place orders,
                and make payments; allows order staff to receive, validate, fulfill,
                ship, and close orders; and permits accountants to generate invoices
                and manage payments. The system stores customers, products, orders,
                invoices and payments and enforces business rules concerning status
                transitions, multiplicities and data integrity.\n\n## 1.3 Definitions
                and acronyms\n- **OMS** – Order Management System\n- **DTO** – Data
                Transfer Object\n- **API** – Application Programming Interface\n-
                **TLS** – Transport Layer Security\n- **NFR** – Non‑Functional Requirement\n-
                **FR** – Functional Requirement\n\n# 2. Overall description\n## 2.1
                Product perspective\nThe OMS is a standalone web‑based application
                that interacts with a relational database for persistence. It exposes
                RESTful services consumed by web or mobile clients.\n\n## 2.2 Product
                functions\n- Manage customers and optional bank accounts.\n- Manage
                product catalogue.\n- Create, validate, and process orders and order
                items.\n- Generate invoices and record payments.\n- Enforce status
                transition rules and business constraints.\n\n## 2.3 User characteristics\n-
                **Customer** – end‑user, familiar with online shopping.\n- **OrderStaff**
                – internal employee, trained in order processing.\n- **Accountant**
                – internal employee, trained in invoicing and payment reconciliation.\n\n##
                2.4 Assumptions and dependencies\n- The system runs on a server supporting
                TLS 1.2+.\n- All monetary values are stored as decimal numbers with
                two fractional digits.\n- External payment gateways are out of scope.\n\n#
                3. Requirements\n## 3.1 Functional requirements\n### US-01\n**As a
                Customer, I want to submit an order that references existing products
                and a payment method, so that I can purchase items.\n**\n- **US-01-AC01**
                `given_when_then` Given the customer is known, the order contains
                at least one order item, and each order item refers to an existing
                product, When the customer submits the order, Then the system creates
                an Order with status *submitted*, sets the order date to the submission
                date, and calculates the total amount as the sum of (quantity × unit
                price) for all items.\n- **US-01-AC02** `condition` All mandatory
                customer attributes (name, address, phone number) must be present;
                the optional bank account may be absent.\n- **US-01-AC03** `given_when_then`
                Given the order fails any validation (unknown customer, no items,
                or non‑existent product), When the customer attempts to submit, Then
                the system rejects the submission and no Order record is created.\n\n###
                US-02\n**As a Customer, I want my personal data (name, address, phone,
                optional bank account) stored securely, so that my information is
                protected.\n**\n- **US-02-AC01** `condition` The system stores a name,
                address and phone number for each Customer; the bank account is optional
                and stored only if provided.\n- **US-02-AC02** `condition` All attributes
                are mandatory except the bank account; attempts to create a Customer
                without a mandatory attribute are rejected.\n- **US-02-AC03`given_when_then`
                Given a request to create a Customer, When the request includes all
                mandatory fields, Then the system persists the Customer record and
                encrypts the bank account data at rest and in transit.\n\n### US-03\n**As
                an OrderStaff, I want to receive a submitted order, so that it can
                be processed.\n**\n- **US-03-AC01** `given_when_then` Given an Order
                whose status is *submitted*, When OrderStaff invokes *receive order*,
                Then the Order status changes to *pending*.\n- **US-03-AC02** `condition`
                The status transition *submitted → pending* is the only allowed change
                for this action.\n- **US-03-AC03`given_when_then` Given an Order whose
                status is not *submitted*, When OrderStaff attempts to receive it,
                Then the system rejects the request and the status remains unchanged.\n\n###
                US-04\n**As an OrderStaff, I want to mark a pending order as filled,
                so that it can be shipped.\n**\n- **US-04-AC01** `given_when_then`
                Given an Order with status *pending*, When OrderStaff marks it as
                filled, Then the status becomes *filled*.\n- **US-04-AC02`condition`
                The only permitted transition for this action is *pending → filled*.\n-
                **US-04-AC03`given_when_then` Given an Order whose status is not *pending*,
                When OrderStaff attempts to fill it, Then the request is rejected
                and the status stays unchanged.\n\n### US-05\n**As an OrderStaff,
                I want to decline a pending order, so that it is closed without further
                processing.\n**\n- **US-05-AC01** `given_when_then` Given an Order
                with status *pending*, When OrderStaff declines it, Then the status
                changes to *closed*.\n- **US-05-AC02`condition` The transition *pending
                → closed* is allowed only for decline actions.\n- **US-05-AC03`given_when_then`
                Given an Order whose status is not *pending*, When OrderStaff attempts
                to decline, Then the request is rejected and the status remains unchanged.\n\n###
                US-06\n**As an OrderStaff, I want to ship a filled order, so that
                the customer receives the goods.\n**\n- **US-06-AC01** `given_when_then`
                Given an Order with status *filled*, When OrderStaff ships it, Then
                the status becomes *shipped*.\n- **US-06-AC02`condition` The only
                permitted transition for shipping is *filled → shipped*.\n- **US-06-AC03`given_when_then`
                Given an Order whose status is not *filled*, When OrderStaff attempts
                to ship, Then the request is rejected and the status stays unchanged.\n\n###
                US-07\n**As an OrderStaff, I want to close a shipped order whose invoice
                is paid, so that the order lifecycle ends.\n**\n- **US-07-AC01** `given_when_then`
                Given an Order with status *shipped* and an associated Invoice with
                status *paid*, When OrderStaff closes the order, Then the Order status
                becomes *closed*.\n- **US-07-AC02`given_when_then` Given a shipped
                Order whose Invoice is not *paid*, When OrderStaff attempts to close,
                Then the request is rejected and the status remains *shipped*.\n-
                **US-07-AC03`given_when_then` Given an Order whose status is not *shipped*,
                When OrderStaff attempts to close, Then the request is rejected.\n\n###
                US-08\n**As an Accountant, I want to raise an invoice for a filled
                or shipped order that has no invoice, so that the customer can be
                billed.\n**\n- **US-08-AC01** `given_when_then` Given an Order with
                status *filled* or *shipped* and no existing Invoice, When Accountant
                creates an Invoice with date, amount, payment method, and status *issued*,
                Then the Invoice is linked to the Order.\n- **US-08-AC02`condition`
                An Order may have at most one Invoice; attempts to create a second
                Invoice are rejected.\n- **US-08-AC03`given_when_then` Given an Order
                whose status is *submitted*, *pending* or *closed*, When Accountant
                attempts to raise an Invoice, Then the request is rejected.\n\n###
                US-09\n**As a Customer, I want to submit a payment against an issued
                invoice, so that I can settle my bill.\n**\n- **US-09-AC01** `given_when_then`
                Given an Invoice with status *issued*, When the Customer submits a
                Payment with date, amount and payment method, Then the system creates
                a Payment with status *pending* linked to the Invoice.\n- **US-09-AC02`given_when_then`
                Given an Invoice with status *paid*, When the Customer attempts to
                submit a Payment, Then the request is rejected.\n- **US-09-AC03`condition`
                Multiple Payments are allowed; each Payment is recorded separately
                and retains its own status.\n\n### US-10\n**As an Accountant, I want
                to confirm a pending payment, so that the invoice can be marked paid.\n**\n-
                **US-10-AC01** `given_when_then` Given a Payment with status *pending*
                linked to an Invoice whose status is *issued*, When Accountant confirms
                the payment, Then the Payment status becomes *completed* and the Invoice
                status becomes *paid*.\n- **US-10-AC02`condition` The only allowed
                transition for a Payment is *pending → completed* (or *failed*).\n-
                **US-10-AC03`given_when_then` Given a Payment whose status is not
                *pending*, When Accountant attempts to confirm, Then the request is
                rejected and the status remains unchanged.\n\n### US-11\n**As an Accountant,
                I want to reject a pending payment, so that the customer can retry.\n**\n-
                **US-11-AC01** `given_when_then` Given a Payment with status *pending*,
                When Accountant rejects it, Then the Payment status becomes *failed*
                and the related Invoice and Order statuses stay unchanged.\n- **US-11-AC02`given_when_then`
                Given a Payment whose status is not *pending*, When Accountant attempts
                to reject, Then the request is rejected.\n- **US-11-AC03`condition`
                A failed Payment remains in the system; subsequent payments may be
                submitted.\n\n### US-12\n**As a system, I want to enforce allowed
                values for statuses, payment methods and monetary types, so that data
                integrity is maintained.\n**\n- **US-12-AC01`condition` Order status
                is restricted to *submitted*, *pending*, *filled*, *shipped*, *closed*.\n-
                **US-12-AC02`condition` Invoice status is restricted to *issued* or
                *paid*.\n- **US-12-AC03`condition` Payment status is restricted to
                *pending*, *completed* or *failed*.\n- **US-12-AC04`condition` Payment
                method is limited to *bank*, *card* or *cash* for Orders, Invoices
                and Payments.\n- **US-12-AC05`condition` All monetary attributes (price,
                unit price, totals, amounts) are stored as decimal numbers.\n\n##
                3.2 Quality attributes\n### 3.2.1 Performance\n- **NFR-01**: When
                a user submits an order containing up to 50 order items under normal
                operating conditions, the system shall register the order and respond
                within **2 seconds** for at least **95 %** of submissions.\n- **NFR-02**:
                Under normal operating conditions, the system shall support at least
                **200 concurrent users** and at least **20 order submissions per second**
                while meeting the response time of NFR‑01.\n\n### 3.2.2 Security\n-
                **NFR-03**: The system shall authenticate every user before granting
                access to any customer, order, invoice or payment data, and shall
                reject **100 %** of unauthenticated requests.\n- **NFR-04**: The system
                shall allow only users holding the **accountant** role to confirm
                or reject a payment, and shall reject the same request from any other
                user.\n- **NFR-05**: The system shall protect customer personal data
                and bank account numbers by encrypting them in transit with **TLS 1.2**
                or higher and at rest.\n\n### 3.2.3 Availability\n- **NFR-06**: The
                system shall be available for at least **99.5 %** of each calendar
                month, excluding scheduled maintenance announced at least **24 hours**
                in advance.\n- **NFR-07**: When a server failure occurs, the system
                shall resume accepting requests within **15 minutes** without losing
                any order, invoice or payment recorded before the failure.\n- **NFR-08**:
                The system shall record the user and the time of every status change
                of an order, an invoice and a payment, and shall retain these records
                for at least **12 months**.\n\n# 4. Verification\nVerification of
                functional requirements will be performed by automated acceptance
                tests derived from the acceptance criteria listed above. Performance,
                security and availability requirements will be validated through load
                testing, penetration testing and monitoring of service uptime.\n\n#
                5. Supporting information\nAppendices include the structural and behavioral
                UML diagrams (see `structural.puml` and `behavioral.puml`), the machine‑readable
                requirements listing (`requirements.json`) and the traceability matrix
                (`VMX.csv`).\n","path":"srs.md"}'

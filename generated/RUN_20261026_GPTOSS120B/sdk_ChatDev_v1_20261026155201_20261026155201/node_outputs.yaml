              name: apply_text_edits
              arguments: '{"path":"srs.md","encoding":"utf-8","start_line":1,"end_line":1000,"replacement":"#
                Software Requirements Specification (SRS)\n\n## 1. Introduction\n###
                1.1 Purpose\nThis document specifies the functional and non‑functional
                requirements for the Order Management System (OMS). It is intended
                for developers, testers, and stakeholders.\n\n### 1.2 Scope\nThe OMS
                supports customers, order staff, and accountants to manage products,
                orders, invoices, and payments.\n\n### 1.3 Definitions and acronyms\n-
                **OMS** – Order Management System\n- **Customer** – End‑user who purchases
                items.\n- **OrderStaff** – Internal staff handling order processing.\n-
                **Accountant** – Internal staff handling invoicing and payments.\n-
                **DTO** – Data Transfer Object.\n- **TLS** – Transport Layer Security.\n\n##
                2. Overall description\n### 2.1 Product perspective\nThe OMS is a
                standalone web‑based application that persists data in a relational
                database and exposes a REST API.\n\n### 2.2 Product functions\n- Manage
                customer records.\n- Manage product catalogue.\n- Create, receive,
                fill, ship, and close orders.\n- Issue invoices and record payments.\n-
                Enforce business rules and audit changes.\n\n### 2.3 User characteristics\n-
                **Customer**: basic internet user, able to browse and place orders.\n-
                **OrderStaff**: internal employee with authority to change order status.\n-
                **Accountant**: internal employee with authority to issue invoices
                and confirm payments.\n\n### 2.4 Assumptions and dependencies\n- System
                runs on a server with a relational DB.\n- TLS 1.2+ is available for
                secure communication.\n\n## 3. Requirements\n### 3.1 Functional requirements\n####
                US-01\n**As a Customer, I want to create a profile with name, address,
                phone and an optional bank account, so that my personal information
                is stored for order processing.**\n- US-01-AC01 (condition): The system
                must store `name`, `address`, and `phone` as non‑empty strings for
                every Customer (REQ‑F‑01, REQ‑F‑45).\n- US-01-AC02 (condition): A
                Customer may have at most one BankAccount; the BankAccount fields
                are optional (REQ‑F‑02, REQ‑F‑45).\n- US-01-AC03 (condition): All
                monetary values are stored as decimal numbers (REQ‑F‑46).\n\n####
                US-02\n**As a Customer, I want to browse products with name, description,
                price and image, so that I can select items to purchase.**\n- US-02-AC01
                (condition): Each Product must have `name`, `description`, `price`,
                and `image` stored (REQ‑F‑03, REQ‑F‑45).\n- US-02-AC02 (condition):
                `price` is a decimal number (REQ‑F‑46).\n- US-02-AC03 (condition):
                Products exist independently of any OrderItem (REQ‑F‑04).\n\n####
                US-03\n**As a Customer, I want to submit an order containing selected
                products, quantities, and a payment method, so that I can purchase
                items.**\n- US-03-AC01 (given_when_then): Given a known Customer and
                at least one valid OrderItem, When the Customer submits the order
                with a payment method, Then the system creates an Order with status
                `submitted` and order date set to the submission date (REQ‑F‑13, REQ‑F‑48).\n-
                US-03-AC02 (given_when_then): Given an unknown Customer, When the
                Customer attempts to submit an order, Then the system rejects the
                submission and no Order is created (REQ‑F‑14).\n- US-03-AC03 (given_when_then):
                Given an order with no OrderItems, When the Customer submits, Then
                the system rejects the submission (REQ‑F‑15).\n- US-03-AC04 (given_when_then):
                Given an OrderItem referencing a non‑existent Product, When the order
                is submitted, Then the system rejects the submission (REQ‑F‑16).\n-
                US-03-AC05 (condition): The Order total amount equals the sum of `quantity
                * unit price` for all OrderItems (REQ‑F‑17).\n- US-03-AC06 (condition):
                `payment method` must be one of `bank`, `card`, `cash` (REQ‑F‑48).\n\n####
                US-04\n**As OrderStaff, I want to receive a submitted order, so that
                it can be processed further.**\n- US-04-AC01 (given_when_then): Given
                an Order with status `submitted`, When OrderStaff receives it, Then
                the status changes to `pending` (REQ‑F‑18).\n- US-04-AC02 (given_when_then):
                Given an Order whose status is not `submitted`, When OrderStaff attempts
                to receive it, Then the status remains unchanged and the operation
                is rejected (REQ‑F‑19).\n- US-04-AC03 (condition): Status changes
                follow the allowed transition set (REQ‑F‑49).\n\n#### US-05\n**As
                OrderStaff, I want to mark a pending order as filled, so that it is
                ready for shipping or invoicing.**\n- US-05-AC01 (given_when_then):
                Given an Order with status `pending`, When OrderStaff marks it as
                filled, Then the status becomes `filled` (REQ‑F‑20).\n- US-05-AC02
                (given_when_then): Given an Order whose status is not `pending`, When
                OrderStaff attempts to mark it filled, Then the status remains unchanged
                (REQ‑F‑21).\n- US-05-AC03 (condition): Status transition `pending
                → filled` is permitted (REQ‑F‑49).\n\n#### US-06\n**As OrderStaff,
                I want to decline a pending order, so that it is closed without fulfillment.**\n-
                US-06-AC01 (given_when_then): Given an Order with status `pending`,
                When OrderStaff declines it, Then the status becomes `closed` (REQ‑F‑22).\n-
                US-06-AC02 (given_when_then): Given an Order whose status is not `pending`,
                When OrderStaff attempts to decline, Then the status remains unchanged
                (REQ‑F‑23).\n- US-06-AC03 (condition): Once an Order reaches `closed`,
                its status cannot change (REQ‑F‑44).\n\n#### US-07\n**As OrderStaff,
                I want to set a filled order to shipped, so that the customer receives
                the items.**\n- US-07-AC01 (given_when_then): Given an Order with
                status `filled`, When OrderStaff ships it, Then the status becomes
                `shipped` (REQ‑F‑25).\n- US-07-AC02 (given_when_then): Given an Order
                whose status is not `filled`, When OrderStaff attempts to ship, Then
                the status remains unchanged (REQ‑F‑26).\n- US-07-AC03 (condition):
                Shipping does not affect the status of related Invoice or Payments
                (REQ‑F‑27).\n\n#### US-08\n**As Accountant, I want to raise an invoice
                for a filled or shipped order that has no invoice, so that the customer
                can be billed.**\n- US-08-AC01 (given_when_then): Given an Order with
                status `filled` or `shipped` and no existing Invoice, When Accountant
                raises an invoice, Then an Invoice is created with status `issued`
                (REQ‑F‑28).\n- US-08-AC02 (given_when_then): Given an Order that already
                has an Invoice, When Accountant attempts to raise another, Then the
                request is rejected (REQ‑F‑29).\n- US-08-AC03 (given_when_then): Given
                an Order whose status is `submitted`, `pending` or `closed`, When
                Accountant attempts to raise an invoice, Then the request is rejected
                (REQ‑F‑30).\n- US-08-AC04 (condition): Invoice status can only transition
                `issued → paid` (REQ‑F‑50).\n\n#### US-09\n**As a Customer, I want
                to submit a payment against an issued invoice, so that the invoice
                can be settled.**\n- US-09-AC01 (given_when_then): Given an Invoice
                with status `issued`, When the Customer submits a payment, Then a
                Payment is created with status `pending` (REQ‑F‑32).\n- US-09-AC02
                (given_when_then): Given an Invoice with status `paid`, When the Customer
                attempts to submit a payment, Then the request is rejected (REQ‑F‑33).\n-
                US-09-AC03 (given_when_then): Given a previous Payment with status
                `failed`, When the Customer submits a further payment, Then a new
                Payment is created with status `pending` and the failed payment remains
                unchanged (REQ‑F‑34).\n- US-09-AC04 (condition): Payment `method`
                must be one of `bank`, `card`, `cash` (REQ‑F‑48).\n\n#### US-10\n**As
                Accountant, I want to confirm or reject pending payments, so that
                invoice status reflects the outcome.**\n- US-10-AC01 (given_when_then):
                Given a Payment with status `pending`, When Accountant confirms it,
                Then the Payment status becomes `completed` and the related Invoice
                status becomes `paid` (REQ‑F‑35, REQ‑F‑36).\n- US-10-AC02 (given_when_then):
                Given a Payment with status `pending`, When Accountant rejects it,
                Then the Payment status becomes `failed` and Invoice status remains
                unchanged (REQ‑F‑38).\n- US-10-AC03 (given_when_then): Given a Payment
                whose status is not `pending`, When Accountant attempts to confirm
                or reject, Then the request is rejected and status remains unchanged
                (REQ‑F‑39).\n- US-10-AC04 (condition): Payment status can only transition
                `pending → completed` or `pending → failed` (REQ‑F‑50).\n\n#### US-11\n**As
                OrderStaff, I want to close a shipped order whose invoice is paid,
                so that the order lifecycle ends.**\n- US-11-AC01 (given_when_then):
                Given an Order with status `shipped` and an associated Invoice with
                status `paid`, When OrderStaff closes the order, Then the Order status
                becomes `closed` (REQ‑F‑40).\n- US-11-AC02 (given_when_then): Given
                a shipped Order whose Invoice is not `paid`, When OrderStaff attempts
                to close, Then the request is rejected (REQ‑F‑41).\n- US-11-AC03 (given_when_then):
                Given an Order whose Invoice is `paid` but Order status is not `shipped`,
                When OrderStaff attempts to close, Then the request is rejected (REQ‑F‑42).\n-
                US-11-AC04 (condition): An Order can be closed only after both shipping
                and invoice settlement are completed, whichever finishes last (REQ‑F‑43).\n\n####
                US-12\n**As System, I want to enforce mandatory attributes, data types
                and value sets, so that data integrity is guaranteed.**\n- US-12-AC01
                (condition): All attributes except Customer bank account are mandatory
                (REQ‑F‑45).\n- US-12-AC02 (condition): Monetary attributes are stored
                as decimal numbers (REQ‑F‑46).\n- US-12-AC03 (condition): Order status
                is restricted to `submitted`, `pending`, `filled`, `shipped`, `closed`;
                Invoice status to `issued`, `paid`; Payment status to `pending`, `completed`,
                `failed` (REQ‑F‑47).\n- US-12-AC04 (condition): Payment method is
                restricted to `bank`, `card`, `cash` (REQ‑F‑48).\n- US-12-AC05 (condition):
                Status transitions follow the allowed tables (REQ‑F‑49, REQ‑F‑50).\n\n####
                US-13\n**As System, I want to enforce multiplicities and lifetimes
                of related entities, so that relationships remain consistent.**\n-
                US-13-AC01 (condition): A Product may be referenced by zero or more
                OrderItems; deleting a Product does not delete OrderItems (REQ‑F‑04).\n-
                US-13-AC02 (condition): An OrderItem belongs to exactly one Order
                and is deleted when its Order is deleted (REQ‑F‑07).\n- US-13-AC03
                (condition): Each Order is associated with exactly one Customer; a
                Customer may have many Orders (REQ‑F‑08).\n- US-13-AC04 (condition):
                An Order may have at most one Invoice; an Invoice is linked to exactly
                one Order (REQ‑F‑10).\n- US-13-AC05 (condition): An Invoice may have
                many Payments; each Payment is linked to exactly one Invoice (REQ‑F‑12).\n\n###
                3.2 Quality attributes\n#### 3.2.1 Performance\n- **NFR-01**: When
                a user submits an order containing up to 50 order items under normal
                operating conditions, the system shall register the order and respond
                within 2 seconds for at least 95% of submissions. (REQ‑N‑01)\n- **NFR-02**:
                Under normal operating conditions, the system shall support at least
                200 concurrent users and at least 20 order submissions per second
                while meeting the response time of NFR‑01. (REQ‑N‑02)\n#### 3.2.2
                Security\n- **NFR-03**: The system shall authenticate every user before
                granting access to any customer, order, invoice or payment data, and
                shall reject 100% of unauthenticated requests. (REQ‑N‑05)\n- **NFR-04**:
                The system shall allow only users holding the accountant role to confirm
                or reject a payment, and shall reject the same request from any other
                user. (REQ‑N‑06)\n- **NFR-05**: The system shall protect customer
                personal data and bank account numbers by encrypting them in transit
                with TLS 1.2 or higher and at rest. (REQ‑N‑07)\n- **NFR-06**: The
                system shall record the user and the time of every status change of
                an order, an invoice and a payment, and shall retain these records
                for at least 12 months. (REQ‑N‑08)\n#### 3.2.3 Availability\n- **NFR-07**:
                The system shall be available for at least 99.5% of each calendar
                month, excluding scheduled maintenance announced at least 24 hours
                in advance. (REQ‑N‑03)\n- **NFR-08**: When a server failure occurs,
                the system shall resume accepting requests within 15 minutes without
                losing any order, invoice or payment recorded before the failure.
                (REQ‑N‑04)\n\n## 4. Verification\nVerification of each functional
                requirement shall be performed by automated test cases derived from
                the acceptance criteria. Non‑functional requirements shall be verified
                by performance testing, security audits, and availability monitoring.\n\n##
                5. Supporting information\n- UML structural diagram: `structural.puml`\n-
                UML behavioral diagram: `behavioral.puml`\n- Requirements traceability
                matrix: `VMX.csv`\n- Machine‑readable requirements listing: `requirements.json`\n"}'

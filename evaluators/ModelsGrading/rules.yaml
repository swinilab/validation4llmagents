# ModelsGrading/rules.yaml — rule-layer vocabularies (spec §9.3)
#
# Consumed only by S1 label normalization (§5.4) and the rule layer (§7.4).
# Nothing here may be duplicated as a literal in source code (§9.1).

# --- status and role whitelists (§7.4.4, §7.4.5) ---
status_sets:
  order:   [submitted, pending, filled, shipped, closed]
  invoice: [issued, paid]
  payment: [pending, completed, failed]
payment_methods: [bank, card, cash]
roles: [Customer, OrderStaff, Accountant]
roles_case_sensitive: true

# --- attribute type compatibility (§7.4.1) ---
# Draft per §16.2: freeze before the first scored run.
type_table:
  Decimal: {accept: [BigDecimal, Numeric, Money], warn: [Float, Double],
            fail: [String, Integer]}
  Integer: {accept: [Int, Long], warn: [], fail: [String, Decimal]}
  Date:    {accept: [DateTime, LocalDate], warn: [Timestamp], fail: [String]}
  String:  {accept: [Text, VarChar], warn: [], fail: [Integer, Decimal, Float]}
type_unlisted: manual             # a gen type in no list goes to the ledger

# --- relationship arrow normalization (§5.1, §7.4.3) ---
rel_type_map:
  '*--': composition
  'o--': aggregation
  '--':  association
  '<|--': generalization
  '<|..': realization
drop_arrows: ['..>']              # class -> enum dependency, not a relationship

# --- guard normalization (§7.4.6) ---
guard_aliases:
  accepted:   [accepted, approved, valid, ok]
  declined:   [declined, rejected, invalid, refused]
  authorized: [authorized, authorised, successful]

# --- label normalization (§5.4) ---
normalization:
  strip_stereotypes: true
  strip_visibility: true
  collapse_separators: ['_', '-']
  lowercase: false                # must stay false; roles are case-sensitive
